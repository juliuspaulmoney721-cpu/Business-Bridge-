<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Sign up — Pixora</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#a83cff"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Pixora"><style>svg{width:26px;height:26px;display:block}</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a class="" href="dashboard.html" title="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-5v6h-5A1.5 1.5 0 0 1 3 19.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></a><a class="" href="search.html" title="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></a><a class="" href="create.html" title="create"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></a><a class="" href="messages.html" title="message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-5 3v-3.5a2 2 0 0 1-2-2v-7.5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></a><a class="" href="notifications.html" title="bell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12l-1.2-1.7a4 4 0 0 1-.8-2.4V10a4 4 0 0 0-8 0v2.9a4 4 0 0 1-.8 2.4zM10 20h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a></nav><a class="avatar" href="profile.html" aria-label="Profile">J</a></header><main class="container"><h1 class="page-title">Create account</h1><p class="subtitle">Join Pixora and start building your network.</p><div class="create-card"><div class="field"><label>Full name</label><input id="name" placeholder="Full name"></div><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Password"></div><div class="field"><label>Account type</label><select id="type"><option>Business</option><option>Creator</option><option>Student</option></select></div><button class="btn accent full" onclick="signup()">Create account</button><p class="muted" style="text-align:center;margin-top:20px">Already have an account? <a href="login.html" style="color:#9d3cf0;font-weight:600">Login</a></p></div></main><nav class="bottom-nav"><a class="" href="dashboard.html"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-5v6h-5A1.5 1.5 0 0 1 3 19.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>Home</a><a class="" href="search.html"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>Search</a><a class="" href="create.html"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>Create</a><a class="" href="messages.html"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-5 3v-3.5a2 2 0 0 1-2-2v-7.5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>Messages</a><a class="" href="profile.html"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 20c.7-4 2.9-6 6.5-6s5.8 2 6.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>Profile</a></nav><script type="module">import { supabase } from './supabase.js'; window.signup=async function(){const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,type=document.getElementById('type').value;if(!name||!email||!password){alert('Complete all fields.');return}if(password.length<6){alert('Password must be at least 6 characters.');return}const username=name.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,24)||'pixorauser';const b=document.querySelector('.btn.accent');if(b){b.disabled=true;b.textContent='Creating account...'}try{const {data,error}=await supabase.auth.signUp({email,password,options:{data:{name,username,account_type:type,bio:'',avatar:'',cover:''}}});if(error)throw error;const p={name,username,bio:'',avatar:'',cover:'',followers:0,following:0};localStorage.setItem('pixora_profile',JSON.stringify(p));localStorage.setItem('bb_name',name);localStorage.setItem('bb_username',username);localStorage.setItem('bb_email',email);if(data.session){await import('./pixora-cloud.js').then(m=>m.ensureProfile());location.href='dashboard.html'}else{alert('Account created. If email confirmation is enabled, check Inbox/Spam for the confirmation email, then log in.');location.href='login.html'}}catch(e){alert(e.message||'Could not create account.');if(b){b.disabled=false;b.textContent='Create account'}}};</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));}</script><script type="module" src="app.js"></script></body></html>
