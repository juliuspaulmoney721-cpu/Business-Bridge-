<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Business Bridge - Sign Up</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      width: 90%;
      max-width: 420px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #12355b;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #12355b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    .login a {
      color: #12355b;
      text-decoration: none;
      font-weight: bold;
    }

    #message {
      text-align: center;
      min-height: 24px;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Business Bridge</h1>

    <p>Create your account</p>

    <form id="signupForm">

      <input
        type="text"
        id="name"
        placeholder="Full Name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Email Address"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <input
        type="password"
        id="confirm"
        placeholder="Confirm Password"
        required
      >

      <select id="account" required>

        <option value="">
          Select Account Type
        </option>

        <option value="Student">
          Student
        </option>

        <option value="Creator">
          Creator
        </option>

        <option value="Business">
          Business
        </option>

      </select>

      <button
        type="submit"
        id="signupButton"
      >
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <div class="login">
      Already have an account?
      <a href="login.html">Sign In</a>
    </div>

  </div>


  <script type="module">

    import { supabase } from "./supabase.js";


    const form =
      document.getElementById("signupForm");

    const message =
      document.getElementById("message");

    const signupButton =
      document.getElementById("signupButton");


    form.addEventListener("submit", async (event) => {

      event.preventDefault();


      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirm =
        document.getElementById("confirm").value;

      const account =
        document.getElementById("account").value;


      message.textContent = "";


      if (password !== confirm) {

        message.textContent =
          "Passwords do not match.";

        return;
      }


      if (password.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        return;
      }


      if (!account) {

        message.textContent =
          "Please select an account type.";

        return;
      }


      signupButton.disabled = true;

      signupButton.textContent =
        "Creating Account...";


      try {

        const { data, error } =
          await supabase.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {

                full_name: name,

                account_type: account

              }

            }

          });


        if (error) {

          message.textContent =
            error.message;

          signupButton.disabled = false;

          signupButton.textContent =
            "Create Account";

          return;
        }


        /*
         * If email confirmation is disabled,
         * Supabase gives us a session immediately.
         */

        if (data.session) {

          window.location.href =
            "dashboard.html";

          return;
        }


        /*
         * If email confirmation is enabled,
         * tell the user to check their email.
         */

        message.textContent =
          "Account created! Please check your email to confirm your account.";

        signupButton.disabled = false;

        signupButton.textContent =
          "Create Account";

      } catch (err) {

        message.textContent =
          "Something went wrong. Please try again.";

        signupButton.disabled = false;

        signupButton.textContent =
          "Create Account";

      }

    });

  </script>

</body>

</html>
