<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up — Pixora</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-wrap"><div class="auth-card"><div class="brand">Pixora</div><h1>Create account</h1><p class="subtitle">Join the Pixora community.</p><div class="field"><label>Full name</label><input id="name" autocomplete="name"></div><div class="field"><label>Username</label><input id="username" autocomplete="username" placeholder="yourusername"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="new-password"></div><button class="btn accent full" id="signup">Create account</button><p class="muted center">Already have an account? <a href="login.html" class="accent-link">Login</a></p><p id="status" class="status"></p></div></main><script type="module">import{supabase}from'./supabase.js';document.getElementById('signup').onclick=async()=>{const name=document.getElementById('name').value.trim(),rawUsername=document.getElementById('username').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,b=document.getElementById('signup'),s=document.getElementById('status');const username=rawUsername.toLowerCase().replace(/^@/,'').replace(/[^a-z0-9._]/g,'').slice(0,30);if(!name||!username||!email||!password){s.textContent='Complete all fields.';return}if(password.length<6){s.textContent='Password must be at least 6 characters.';return}b.disabled=true;b.textContent='Creating...';try{const{data,error}=await supabase.auth.signUp({email,password,options:{data:{name,username}}});if(error)throw error;if(data.session)location.href='dashboard.html';else{s.textContent='Account created. Check your email to confirm, then log in.';b.disabled=false;b.textContent='Create account'}}catch(e){s.textContent=e.message||'Could not create account.';b.disabled=false;b.textContent='Create account'}};</script></body></html>
