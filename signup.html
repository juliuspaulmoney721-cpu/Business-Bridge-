<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Bridge - Sign Up</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.container{width:90%;max-width:420px;background:#fff;padding:35px;border-radius:18px;box-shadow:0 10px 25px rgba(0,0,0,.15)}
h1{text-align:center;color:#12355b;margin-bottom:10px}
p{text-align:center;color:#666;margin-bottom:25px}
input,select{width:100%;padding:14px;margin-bottom:15px;border:1px solid #ccc;border-radius:10px;font-size:16px}
button{width:100%;padding:15px;background:#12355b;color:white;border:none;border-radius:10px;font-size:18px;cursor:pointer}
.login{text-align:center;margin-top:20px}
.login a{color:#12355b;text-decoration:none;font-weight:bold}
#message{text-align:center;min-height:20px;margin-top:15px}
</style>
</head>
<body>
<div class="container">
<h1>Business Bridge</h1>
<p>Create your account</p>

<form id="signupForm">
<input type="text" id="name" placeholder="Full Name" required autocomplete="name">
<input type="email" id="email" placeholder="Email Address" required autocomplete="email">
<input type="password" id="password" placeholder="Password" required autocomplete="new-password">
<input type="password" id="confirm" placeholder="Confirm Password" required autocomplete="new-password">

<select id="account" required>
<option value="">Select Account Type</option>
<option value="Student">Student</option>
<option value="Creator">Creator</option>
<option value="Business">Business</option>
</select>

<button type="submit">Create Account</button>
</form>

<div id="message"></div>

<div class="login">
Already have an account?
<a href="login.html">Sign In</a>
</div>
</div>

<script type="module">
import { supabase } from "./supabase.js";

const form = document.getElementById("signupForm");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  const account = document.getElementById("account").value;

  if (password !== confirm) {
    message.textContent = "Passwords do not match.";
    return;
  }

  if (password.length < 6) {
    message.textContent = "Password must be at least 6 characters.";
    return;
  }

  message.textContent = "Creating account...";

  const { data, error } = await supabase.auth.signUp({
    email,
    password,
    options: {
      data: {
        full_name: name,
        account_type: account
      }
    }
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  if (data.session) {
    window.location.href = "dashboard.html";
    return;
  }

  message.textContent = "Account created. Check your email to verify your account, then log in.";
});
</script>
</body>
</html>
