<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business Bridge - Sign Up</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 90%;
    max-width: 420px;
    margin: 50px auto;
    padding: 30px 25px;
    background: #111;
    border: 1px solid #333;
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(190, 60, 255, 0.15);
}

h1 {
    text-align: center;
    color: #c84cff;
    font-size: 32px;
    margin-bottom: 10px;
}

p {
    text-align: center;
    color: #aaa;
    margin-bottom: 30px;
}

input,
select {
    width: 100%;
    padding: 15px;
    margin-bottom: 15px;
    background: #1a1a1a;
    color: white;
    border: 1px solid #444;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #c84cff;
}

button {
    width: 100%;
    padding: 16px;
    background: #c84cff;
    color: white;
    border: none;
    border-radius: 30px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #b638ed;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.login {
    text-align: center;
    margin-top: 25px;
    color: #aaa;
}

.login a {
    color: #c84cff;
    text-decoration: none;
    font-weight: bold;
}

#message {
    text-align: center;
    min-height: 25px;
    margin-top: 20px;
    color: #c84cff;
}
</style>
</head>

<body>

<div class="container">

    <h1>Business Bridge</h1>

    <p>Create your account</p>

    <form id="signupForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <input
            type="password"
            id="confirm"
            placeholder="Confirm Password"
            required
        >

        <select id="account" required>

            <option value="">
                Select Account Type
            </option>

            <option value="Student">
                Student
            </option>

            <option value="Creator">
                Creator
            </option>

            <option value="Business">
                Business
            </option>

        </select>

        <button type="submit" id="signupButton">
            Create Account
        </button>

    </form>

    <div id="message"></div>

    <div class="login">
        Already have an account?
        <a href="login.html">Sign In</a>
    </div>

</div>


<script type="module">

import { supabase } from "./supabase.js";


const form = document.getElementById("signupForm");

const message = document.getElementById("message");

const signupButton = document.getElementById("signupButton");


form.addEventListener("submit", async (event) => {

    event.preventDefault();


    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirm =
        document.getElementById("confirm").value;

    const account =
        document.getElementById("account").value;


    // Check passwords

    if (password !== confirm) {

        message.textContent =
            "Passwords do not match.";

        return;
    }


    // Check password length

    if (password.length < 6) {

        message.textContent =
            "Password must be at least 6 characters.";

        return;
    }


    // Check account type

    if (!account) {

        message.textContent =
            "Please select an account type.";

        return;
    }


    message.textContent =
        "Creating account...";

    signupButton.disabled = true;


    try {

        /*
         * IMPORTANT:
         * This tells Supabase exactly where to send
         * the user after email confirmation.
         */

        const redirectUrl =
            window.location.origin + "/dashboard.html";


        const { data, error } =
            await supabase.auth.signUp({

                email: email,

                password: password,

                options: {

                    emailRedirectTo: redirectUrl,

                    data: {

                        full_name: name,

                        account_type: account

                    }

                }

            });


        // Supabase error

        if (error) {

            message.textContent =
                error.message;

            signupButton.disabled = false;

            return;
        }


        /*
         * If email confirmation is disabled,
         * Supabase creates a session immediately.
         */

        if (data.session) {

            message.textContent =
                "Account created! Redirecting...";

            window.location.href =
                "dashboard.html";

            return;
        }


        /*
         * If email confirmation is enabled,
         * the user needs to check their email.
         */

        message.textContent =
            "Account created! Please check your email to confirm your account.";

        signupButton.disabled = false;


    } catch (error) {

        message.textContent =
            "Something went wrong. Please try again.";

        signupButton.disabled = false;

        console.error(error);
    }

});

</script>

</body>
</html>
