<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Business Bridge</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172b4d;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .header {
      background: white;
      padding: 22px 20px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #172b4d;
    }

    .logo span {
      color: #a855f7;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .profile-card {
      background: white;
      border-radius: 22px;
      padding: 30px 22px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.07);
      text-align: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #9333ea, #c026d3);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 42px;
      font-weight: bold;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .email {
      color: #6b7280;
      margin-bottom: 28px;
      word-break: break-word;
    }

    .info-box {
      background: #f8f5ff;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 15px;
      text-align: left;
    }

    .info-label {
      color: #7c3aed;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .info-value {
      font-size: 17px;
      color: #172b4d;
      word-break: break-word;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .dashboard-btn {
      background: #172b4d;
      color: white;
    }

    .logout-btn {
      background: #fee2e2;
      color: #dc2626;
    }

    #message {
      margin-top: 18px;
      font-weight: bold;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 75px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .bottom-nav a {
      text-decoration: none;
      color: #777;
      text-align: center;
      font-size: 13px;
    }

    .bottom-nav a.active {
      color: #9333ea;
      font-weight: bold;
    }

    .nav-icon {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">
      <span>Business</span>Bridge
    </div>
  </header>

  <main class="container">

    <section class="profile-card">

      <div class="avatar" id="avatar">
        J
      </div>

      <h1 id="userName">My Profile</h1>

      <p class="email" id="userEmail">
        Loading account...
      </p>

      <div class="info-box">
        <div class="info-label">ACCOUNT EMAIL</div>
        <div class="info-value" id="emailInfo">
          Loading...
        </div>
      </div>

      <div class="info-box">
        <div class="info-label">MEMBERSHIP</div>
        <div class="info-value">
          Business Bridge Member
        </div>
      </div>

      <button
        class="dashboard-btn"
        onclick="window.location.href='dashboard.html'">
        🏠 Back to Dashboard
      </button>

      <button
        class="logout-btn"
        id="logoutBtn">
        🚪 Log Out
      </button>

      <div id="message"></div>

    </section>

  </main>

  <nav class="bottom-nav">

    <a href="dashboard.html">
      <span class="nav-icon">⌂</span>
      Home
    </a>

    <a href="search.html">
      <span class="nav-icon">⌕</span>
      Search
    </a>

    <a href="create.html">
      <span class="nav-icon">＋</span>
      Create
    </a>

    <a href="chat.html">
      <span class="nav-icon">♡</span>
      Messages
    </a>

    <a href="profile.html" class="active">
      <span class="nav-icon">●</span>
      Profile
    </a>

  </nav>

  <script type="module">

    import { supabase } from "./supabase.js";

    async function loadProfile() {

      const message = document.getElementById("message");

      try {

        const { data, error } = await supabase.auth.getUser();

        if (error || !data.user) {

          window.location.href = "login.html";
          return;
        }

        const user = data.user;

        const email = user.email || "No email";

        document.getElementById("userEmail").textContent = email;
        document.getElementById("emailInfo").textContent = email;

        const firstLetter =
          email.charAt(0).toUpperCase();

        document.getElementById("avatar").textContent =
          firstLetter;

        document.getElementById("userName").textContent =
          "My Profile";

      } catch (error) {

        message.style.color = "red";
        message.textContent =
          "Unable to load your profile.";

      }

    }

    document
      .getElementById("logoutBtn")
      .addEventListener("click", async () => {

        const message = document.getElementById("message");

        message.style.color = "#7c3aed";
        message.textContent = "Logging out...";

        const { error } = await supabase.auth.signOut();

        if (error) {

          message.style.color = "red";
          message.textContent = error.message;
          return;

        }

        window.location.href = "login.html";

      });

    loadProfile();

  </script>

</body>
</html>
