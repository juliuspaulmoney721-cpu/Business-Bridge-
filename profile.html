<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — Pixora</title><link rel="stylesheet" href="styles.css"><style>.profile-main{padding:34px 28px 40px}.profile-avatar{width:150px;height:150px;border:8px solid #fff;border-radius:50%;background:#f0e5f8;display:grid;place-items:center;color:#9d3cf0;font-size:55px;font-weight:700;object-fit:cover}.profile-avatar-wrap{margin-bottom:18px}.profile-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:-55px;margin-bottom:35px}.profile-stats{display:flex;gap:42px;margin:30px 0;font-size:18px}.profile-stats b{font-size:22px}.modal.open{display:flex}.modal{align-items:center;justify-content:center}.sheet{width:min(520px,92%);border-radius:22px}.post-owner-actions{display:flex;gap:8px;justify-content:flex-end;padding:0 18px 14px}.post-owner-actions .btn{padding:8px 11px;font-size:13px}.btn.danger{background:#fff0f0;color:#c62828}.edit-preview{max-width:100%;max-height:260px;border-radius:14px;display:block;margin:10px 0}</style></head><body>
<header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a href="search.html">⌕</a><a href="create.html">＋</a><a href="messages.html">▢</a><a href="notifications.html">♧</a></nav><a class="avatar" data-user-avatar href="profile.html">?</a></header>
<main class="container profile-main"><div id="avatar" class="profile-avatar-wrap"></div><div id="actions" class="profile-actions"></div><h1 id="name" class="page-title"></h1><div id="username" class="muted"></div><p id="bio" class="subtitle"></p><div class="profile-stats"><span><b id="followers">0</b> followers</span><span><b id="following">0</b> following</span><span><b id="postCount">0</b> posts</span></div><div id="posts"></div></main>
<nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>▢</span>Messages</a><a class="active" href="profile.html"><span>◯</span>Profile</a></nav>
<div id="modal" class="modal"><div class="sheet"><h2>Edit profile</h2><div class="field"><label>Name</label><input id="editName"></div><div class="field"><label>Username</label><input id="editUsername"></div><div class="field"><label>Bio</label><textarea id="editBio" rows="4"></textarea></div><div class="field"><label>Profile photo</label><input id="editAvatar" type="file" accept="image/*"></div><div style="display:flex;gap:10px"><button class="btn secondary" id="cancel">Cancel</button><button class="btn accent" id="save">Save</button></div><p id="editStatus" class="status"></p></div></div>
<div id="postModal" class="modal"><div class="sheet"><h2>Edit post</h2><div class="field"><label>Caption</label><textarea id="postEditContent" rows="5"></textarea></div><div id="postCurrentImage"></div><div class="field"><label>Change photo</label><input id="postEditImage" type="file" accept="image/*"></div><label style="display:flex;gap:8px;align-items:center;margin:12px 0"><input id="postRemoveImage" type="checkbox"> Remove photo</label><div style="display:flex;gap:10px"><button class="btn secondary" id="postCancel">Cancel</button><button class="btn accent" id="postSave">Save changes</button></div><p id="postStatus" class="status"></p></div></div>
<script type="module">import{currentUser,myProfile,getProfileByUsername,getCounts,updateProfile,uploadImage,toggleFollow,isFollowing,listPosts,updatePost,deletePost,deletePostImage}from'./pixora-api.js';const esc=s=>window.pixoraEsc?.(s)||String(s??'');let me,profile,own=false;const param=new URLSearchParams(location.search).get('user');const $=id=>document.getElementById(id);async function render(){me=await currentUser();profile=param?await getProfileByUsername(param):await myProfile();if(!profile)throw new Error('User not found.');own=profile.id===me.id;$('name').textContent=profile.name;$('username').textContent='@'+profile.username;$('bio').textContent=profile.bio||'';$('bio').style.display=profile.bio?'block':'none';const c=await getCounts(profile.id);$('followers').textContent=c.followers;$('following').textContent=c.following;$('postCount').textContent=c.posts;$('avatar').innerHTML=profile.avatar_url?`<img class="profile-avatar" src="${esc(profile.avatar_url)}">`:`<div class="profile-avatar">${esc((profile.name||'?')[0].toUpperCase())}</div>`;$('actions').innerHTML=own?'<button class="btn secondary" id="edit">⚙ Edit profile</button>':`<button class="btn secondary" id="follow">${await isFollowing(profile.id)?'Following':'Follow'}</button><a class="btn accent" href="chat.html?user=${encodeURIComponent(profile.username)}">Message</a>`;if(!own)$('follow').onclick=async()=>{await toggleFollow(profile.id);render()};if(own)$('edit').onclick=openEdit;const posts=(await listPosts()).filter(p=>p.author_id===profile.id);$('posts').innerHTML=posts.length?posts.map(p=>`<article class="post">${p.image_url?`<div class="post-media"><img src="${esc(p.image_url)}"></div>`:''}<div class="post-body"><div class="caption">${esc(p.content||'')}</div><div class="post-time">${new Date(p.created_at).toLocaleString()}</div></div>${own?`<div class="post-owner-actions"><button class="btn secondary profile-edit-post" data-id="${esc(p.id)}">Edit</button><button class="btn danger profile-delete-post" data-id="${esc(p.id)}">Delete</button></div>`:''}</article>`).join(''):'<div class="empty"><div class="empty-icon">＋</div><h2>No posts yet</h2><p>Posts you create will appear here.</p></div>';document.querySelectorAll('.profile-edit-post').forEach(b=>b.onclick=()=>openPostEdit(b.dataset.id));document.querySelectorAll('.profile-delete-post').forEach(b=>b.onclick=()=>removeOwnPost(b.dataset.id))}function openEdit(){$('editName').value=profile.name;$('editUsername').value=profile.username;$('editBio').value=profile.bio||'';$('modal').classList.add('open')}$('cancel').onclick=()=>$('modal').classList.remove('open');$('save').onclick=async()=>{const b=$('save'),s=$('editStatus');b.disabled=true;s.textContent='Saving...';try{let avatar=profile.avatar_url;if($('editAvatar').files[0])avatar=await uploadImage($('editAvatar').files[0],'avatars');await updateProfile({name:$('editName').value,username:$('editUsername').value,bio:$('editBio').value,avatar_url:avatar});$('modal').classList.remove('open');location.reload()}catch(e){s.textContent=e.message;b.disabled=false}};let editingPost=null;async function openPostEdit(id){const posts=(await listPosts()).filter(p=>p.author_id===profile.id);editingPost=posts.find(p=>String(p.id)===String(id));if(!editingPost)return;$('postEditContent').value=editingPost.content||'';$('postEditImage').value='';$('postRemoveImage').checked=false;$('postCurrentImage').innerHTML=editingPost.image_url?`<img class="edit-preview" src="${esc(editingPost.image_url)}" alt="Current photo">`:'';$('postStatus').textContent='';$('postModal').classList.add('open')}async function removeOwnPost(id){if(!confirm('Delete this post? This cannot be undone.'))return;try{const posts=await listPosts();const p=posts.find(x=>String(x.id)===String(id));await deletePost(id);if(p?.image_url)await deletePostImage(p.image_url);await render()}catch(e){alert(e.message)}}$('postCancel').onclick=()=>$('postModal').classList.remove('open');$('postSave').onclick=async()=>{if(!editingPost)return;const b=$('postSave'),st=$('postStatus');b.disabled=true;st.textContent='Saving...';try{let imageUrl=editingPost.image_url||'';const file=$('postEditImage').files[0];if($('postRemoveImage').checked)imageUrl='';else if(file)imageUrl=await uploadImage(file,'posts');await updatePost(editingPost.id,{content:$('postEditContent').value,imageUrl});if(editingPost.image_url&&imageUrl!==editingPost.image_url)await deletePostImage(editingPost.image_url);$('postModal').classList.remove('open');editingPost=null;await render()}catch(e){st.textContent=e.message||'Could not update post'}finally{b.disabled=false}};render().catch(e=>alert(e.message));</script><script type="module" src="app.js"></script></body></html>
