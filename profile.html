<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>Profile — Pixora</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a83cff"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Pixora">
<style>
.profile-page{max-width:760px;margin:0 auto;padding-bottom:24px}
.profile-cover{height:160px;background:linear-gradient(100deg,#f4dcff,#ffe9e2);position:relative;border-bottom:1px solid #eee;overflow:hidden;background-size:cover;background-position:center}.profile-cover.has-image{background-color:#eee4f7}.cover-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.04),rgba(0,0,0,.12));pointer-events:none}
.profile-main{padding:0 34px}
.profile-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;margin-top:-44px}
.profile-avatar{width:142px;height:142px;border-radius:50%;background:#eee4f7;border:8px solid #fff;display:grid;place-items:center;color:#913bd2;font-size:48px;font-weight:500;overflow:hidden}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.edit-profile{margin-top:62px;background:#f2f2f2;border:0;color:#222;border-radius:13px;padding:13px 21px;font-weight:500;font-size:18px;display:flex;align-items:center;gap:12px;cursor:pointer}
.edit-profile svg{width:25px;height:25px}
.profile-name{font-size:36px;line-height:1.15;margin:40px 0 8px;font-weight:750;letter-spacing:-.8px}
.username{font-size:21px;color:#777;margin:0}
.bio{font-size:18px;line-height:1.5;margin:14px 0 0;color:#555;white-space:pre-wrap}
.follow-row{display:flex;gap:52px;margin:48px 0 38px;font-size:21px;color:#666}
.follow-row strong{color:#111}
.highlight{width:82px;text-align:center;color:#666;font-size:17px}
.highlight-circle{width:82px;height:82px;border:4px dashed #ddd;border-radius:50%;display:grid;place-items:center;font-size:36px;margin-bottom:10px}
.profile-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #ddd;margin-top:66px}
.profile-tab{height:62px;display:flex;justify-content:center;align-items:center;gap:12px;font-size:23px;color:#666;position:relative;background:none;border:0}
.profile-tab.active{color:#8e3bd1}
.profile-tab.active:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:4px;background:#9a3ed8}
.profile-tab svg{width:27px;height:27px}
.no-posts{text-align:center;color:#666;padding:120px 20px 150px}
.no-posts svg{width:72px;height:72px;color:#ccc;margin-bottom:24px}
.no-posts div{font-size:30px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-end;z-index:50}
.modal.open{display:flex}
.sheet{width:100%;max-width:760px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;padding:24px;max-height:88vh;overflow:auto;box-sizing:border-box}
.sheet h2{margin:0 0 20px;font-size:28px}
.field{margin:12px 0}.field label{display:block;font-weight:600;margin-bottom:7px}
.field input,.field textarea{width:100%;box-sizing:border-box;border:1px solid #dddde2;border-radius:12px;padding:13px;outline:none;background:#fafafa;font-size:16px}
.sheet-actions{display:flex;gap:10px;margin-top:18px}.sheet-actions button{flex:1;border:0;cursor:pointer}
.profile-edit-avatar-wrap{text-align:center;margin-bottom:18px}
.change-photo{display:inline-block;color:#8e3bd1;font-weight:600;cursor:pointer}
@media(max-width:650px){.profile-main{padding:0 34px}.profile-avatar{width:128px;height:128px;font-size:44px}.edit-profile{font-size:17px;padding:12px 16px}.profile-name{font-size:34px}.follow-row{gap:36px;font-size:20px}.profile-tab{font-size:21px}}
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="dashboard.html">Pixora</a>
<nav class="topnav">
<a href="dashboard.html"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-5v6h-5A1.5 1.5 0 0 1 3 19.5z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></a>
<a href="search.html"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></a>
<a href="create.html"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8"/></svg></a>
<a href="messages.html"><svg viewBox="0 0 24 24"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-5 3v-3.5a2 2 0 0 1-2-2v-7.5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></a>
<a href="notifications.html"><svg viewBox="0 0 24 24"><path d="M6 17h12l-1.2-1.7a4 4 0 0 1-.8-2.4V10a4 4 0 0 0-8 0v2.9a4 4 0 0 1-.8 2.4zM10 20h4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></a>
</nav><a class="avatar" id="headerAvatar" href="profile.html">J</a>
</header>

<main class="profile-page">
<section class="profile-cover" id="profileCover"><div class="cover-overlay"></div></section>
<section class="profile-main">
<div class="profile-top"><div id="profileAvatar" class="profile-avatar">J</div><button class="edit-profile" id="editBtn"><svg viewBox="0 0 24 24"><path d="M12 3l1.3 2.2 2.5.5 1.8-1.3 1.9 1.9-1.3 1.8.5 2.5L21 12l-2.3 1.3-.5 2.5 1.3 1.8-1.9 1.9-1.8-1.3-2.5.5L12 21l-1.3-2.3-2.5-.5-1.8 1.3-1.9-1.9 1.3-1.8-.5-2.5L3 12l2.3-1.3.5-2.5-1.3-1.8 1.9-1.9 1.8 1.3 2.5-.5z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg> Edit profile</button></div>
<h1 class="profile-name" id="profileName"></h1><p class="username" id="profileUsername"></p><p class="bio" id="profileBio"></p>
<div class="follow-row"><span><strong id="followers">0</strong> followers</span><span><strong id="following">0</strong> following</span></div>
<div class="highlight"><div class="highlight-circle">+</div>New</div>
<div class="profile-tabs"><button class="profile-tab active"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 4v16M15 4v16M4 9h16M4 15h16" stroke="currentColor" stroke-width="1.5"/></svg>Posts</button><button class="profile-tab"><svg viewBox="0 0 24 24"><path d="M8 4h8l-1 6 3 3v2H6v-2l3-3zM9 15v5M15 15v5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Pinned</button></div>
<div class="no-posts" id="noPosts"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 5v14M15 5v14M5 9h14M5 15h14"/></svg><div>No posts yet</div></div>
</section></main>

<div class="modal" id="editModal" role="dialog" aria-modal="true">
  <div class="sheet">
    <h2>Edit profile</h2>
    <div class="profile-edit-avatar-wrap">
      <div id="editAvatarPreview" class="profile-avatar" style="margin:0 auto 10px;width:96px;height:96px;font-size:34px">J</div>
      <label class="change-photo">Change profile picture<input id="avatarInput" class="profile-avatar-input" type="file" accept="image/*"></label><br><label class="change-photo">Change cover photo<input id="coverInput" class="profile-avatar-input" type="file" accept="image/*"></label>
    </div>
    <div class="field"><label for="editName">Name</label><input id="editName" maxlength="60" autocomplete="name"></div>
    <div class="field"><label for="editUsername">Username</label><input id="editUsername" maxlength="30" placeholder="yourusername" autocomplete="username"></div>
    <div class="field"><label for="editBio">Bio</label><textarea id="editBio" rows="4" maxlength="160" placeholder="Tell people about yourself"></textarea></div>
    <div class="sheet-actions"><button class="btn secondary" id="cancelEdit">Cancel</button><button class="btn accent" id="saveEdit">Save changes</button></div>
  </div>
</div>

<nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>⊞</span>Create</a><a href="messages.html"><span>▢</span>Messages</a><a class="active" href="profile.html"><span>♙</span>Profile</a></nav>
<script src="pixora-data.js"></script><script>
function getProfile(){return PixoraData.me()}
function saveProfile(p){return PixoraData.saveMe(p)}
function readImage(file,maxW,maxH,quality=0.84){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/')){reject(new Error('Please choose an image.'));return}const reader=new FileReader();reader.onerror=()=>reject(new Error('Could not read the image.'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Could not load the image.'));img.onload=()=>{const scale=Math.min(1,maxW/img.width,maxH/img.height);const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};img.src=reader.result};reader.readAsDataURL(file)})}
function initial(n){return(String(n||'?').trim()[0]||'?').toUpperCase()}
function avatar(el,p){el.innerHTML=p.avatar?`<img src="${p.avatar}" alt="Profile picture">`:initial(p.name)}
function render(){const p=getProfile();document.getElementById('profileName').textContent=p.name;document.getElementById('profileUsername').textContent='@'+p.username;document.getElementById('profileBio').textContent=p.bio||'';document.getElementById('profileBio').style.display=p.bio?'block':'none';document.getElementById('followers').textContent=PixoraData.followersCount(p.username);document.getElementById('following').textContent=PixoraData.followingCount(p.username);avatar(document.getElementById('profileAvatar'),p);const h=document.getElementById('headerAvatar');h.innerHTML=p.avatar?`<img class="avatar-photo" src="${p.avatar}" alt="Profile picture">`:initial(p.name);const cover=document.getElementById('profileCover');if(p.cover){cover.style.backgroundImage=`url("${p.cover}")`;cover.classList.add('has-image')}else{cover.style.backgroundImage='';cover.classList.remove('has-image')}const posts=PixoraData.read('bb_posts',[]).filter(x=>x&&x.username===p.username);document.getElementById('noPosts').style.display=posts.length?'none':'block'}
function openEditor(){const p=getProfile();document.getElementById('editName').value=p.name||'';document.getElementById('editUsername').value=p.username||'';document.getElementById('editBio').value=p.bio||'';const preview=document.getElementById('editAvatarPreview');avatar(preview,p);preview.style.width='96px';preview.style.height='96px';preview.style.fontSize='34px';preview.dataset.avatar='';preview.dataset.cover=p.cover||'';document.getElementById('editModal').classList.add('open')}
document.getElementById('editBtn').onclick=openEditor;document.getElementById('cancelEdit').onclick=()=>document.getElementById('editModal').classList.remove('open');document.getElementById('editModal').addEventListener('click',e=>{if(e.target.id==='editModal')e.currentTarget.classList.remove('open')});
document.getElementById('avatarInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=await readImage(f,800,800,.86);document.getElementById('editAvatarPreview').innerHTML=`<img src="${data}" alt="Profile picture">`;document.getElementById('editAvatarPreview').dataset.avatar=data}catch(err){alert(err.message)}};
document.getElementById('coverInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=await readImage(f,1600,700,.84);document.getElementById('editAvatarPreview').dataset.cover=data;alert('Cover photo selected. Tap Save changes to apply it.')}catch(err){alert(err.message)}};
document.getElementById('saveEdit').onclick=()=>{const p=getProfile(),oldUsername=p.username,name=document.getElementById('editName').value.trim(),username=document.getElementById('editUsername').value.trim().replace(/^@/,'').toLowerCase(),bio=document.getElementById('editBio').value.trim();if(!name){alert('Enter your name.');return}if(!/^[a-z0-9._]{3,30}$/.test(username)){alert('Username must be 3–30 characters and use only letters, numbers, dots or underscores.');return}p.name=name;p.username=username;p.bio=bio;const av=document.getElementById('editAvatarPreview').dataset.avatar;if(av)p.avatar=av;const cv=document.getElementById('editAvatarPreview').dataset.cover;if(cv)p.cover=cv;saveProfile(p);let posts=PixoraData.read('bb_posts',[]);posts=posts.map(x=>x.username===oldUsername?{...x,username:p.username,user:p.name,avatar:p.avatar||''}:x);PixoraData.write('bb_posts',posts);let profiles=PixoraData.read('pixora_profiles',[]).filter(x=>x.username!==oldUsername);profiles.push(p);PixoraData.write('pixora_profiles',profiles);document.getElementById('editModal').classList.remove('open');render()};render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));}</script>
