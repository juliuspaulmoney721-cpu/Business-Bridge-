<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>Profile — Business Bridge</title><link rel="stylesheet" href="styles.css">
<style>
.profile-page{max-width:760px;margin:0 auto;padding-bottom:24px}
.profile-cover{height:96px;background:linear-gradient(100deg,#f4dcff,#ffe9e2);position:relative;border-bottom:1px solid #eee}
.profile-main{padding:0 34px}
.profile-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;margin-top:-44px}
.profile-avatar{width:142px;height:142px;border-radius:50%;background:#eee4f7;border:8px solid #fff;display:grid;place-items:center;color:#913bd2;font-size:48px;font-weight:500}
.edit-profile{margin-top:62px;background:#f2f2f2;border-radius:13px;padding:13px 21px;font-weight:500;font-size:18px;display:flex;align-items:center;gap:12px}
.edit-profile svg{width:25px;height:25px}
.profile-name{font-size:36px;line-height:1.15;margin:40px 0 8px;font-weight:750;letter-spacing:-.8px}
.username{font-size:21px;color:#777;margin:0}
.follow-row{display:flex;gap:52px;margin:48px 0 38px;font-size:21px;color:#666}
.follow-row strong{color:#111}
.highlight{width:82px;text-align:center;color:#666;font-size:17px}
.highlight-circle{width:82px;height:82px;border:4px dashed #ddd;border-radius:50%;display:grid;place-items:center;font-size:36px;margin-bottom:10px}
.profile-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #ddd;margin-top:66px}
.profile-tab{height:62px;display:flex;justify-content:center;align-items:center;gap:12px;font-size:23px;color:#666;position:relative}
.profile-tab.active{color:#8e3bd1}
.profile-tab.active:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:4px;background:#9a3ed8}
.profile-tab svg{width:27px;height:27px}
.no-posts{text-align:center;color:#666;padding:120px 20px 150px}
.no-posts svg{width:72px;height:72px;color:#ccc;margin-bottom:24px}
.no-posts div{font-size:30px}
@media(max-width:650px){
 .profile-main{padding:0 34px}.profile-cover{height:96px}.profile-avatar{width:128px;height:128px;font-size:44px}.edit-profile{font-size:17px;padding:12px 16px}.profile-name{font-size:34px}.follow-row{gap:36px;font-size:20px}.profile-tab{font-size:21px}
}
</style>
</head>
