<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixora</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a class="active" href="dashboard.html">⌂</a><a href="search.html">⌕</a><a href="create.html">＋</a><a href="messages.html">▢</a><a href="notifications.html">♧</a></nav><a class="avatar" data-user-avatar href="profile.html">?</a></header><main class="container"><div id="stories" class="stories"></div><div id="feed"><div class="status">Loading your feed...</div></div></main><nav class="bottom-nav"><a class="active" href="dashboard.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>▢</span>Messages</a><a href="profile.html"><span>◯</span>Profile</a></nav><script type="module">import{listPosts,toggleLike,currentUser,myProfile}from'./pixora-api.js';import{supabase}from'./supabase.js';const esc=s=>window.pixoraEsc?.(s)||String(s??'');const avatar=p=>p?.avatar_url?`<img class="post-avatar avatar-photo" src="${esc(p.avatar_url)}" alt="">`:`<div class="post-avatar big-avatar">${esc((p?.name||'?')[0].toUpperCase())}</div>`;async function render(){try{const posts=await listPosts(),me=await currentUser();if(!posts.length){document.getElementById('feed').innerHTML='<div class="empty"><div class="empty-icon">✦</div><h2>Your feed is empty</h2><p>Follow people and create your first post.</p><br><a class="btn accent" href="create.html">Create a post</a></div>';return}const likes=await supabase.from('post_likes').select('post_id,user_id').in('post_id',posts.map(p=>p.id));const liked=new Set((likes.data||[]).filter(x=>x.user_id===me.id).map(x=>x.post_id));document.getElementById('feed').innerHTML=posts.map(p=>`<article class="post"><div class="post-head">${avatar(p.profiles)}<div><div class="post-user">${esc(p.profiles?.name)}</div><div class="post-time">${new Date(p.created_at).toLocaleString()}</div></div></div>${p.image_url?`<div class="post-media"><img src="${esc(p.image_url)}" alt="Post image"></div>`:''}<div class="post-body"><div class="post-actions"><button class="like-btn ${liked.has(p.id)?'liked':''}" data-id="${p.id}">${liked.has(p.id)?'♥':'♡'}</button><button>◯</button><button>↗</button></div><div class="caption">${esc(p.caption)}</div></div></article>`).join('');document.querySelectorAll('.like-btn').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await toggleLike(b.dataset.id);render()}catch(e){alert(e.message)}finally{b.disabled=false}})}catch(e){document.getElementById('feed').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}await myProfile();render();</script><script type="module" src="app.js"></script></body></html>
