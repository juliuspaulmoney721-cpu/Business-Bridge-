l-1.2-1.7a4 4 0 0 1-.8-2.4V10a4 4 0 0 0-8 0v2.9a4 4 0 0 1-.8 2.4zM10 20h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a></nav><a class="avatar" href="profile.html" aria-label="Profile">J</a></header><main class="container">

 <div class="story add"><div class="story-ring"><div class="story-inner">J</div></div><div>Your story</div></div>
</section>
<div id="feed"></div>
</main><nav class="bottom-nav"><a class="active" href="dashboard.html"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-5v6h-5A1.5 1.5 0 0 1 3 19.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>Home</a><a class="" href="search.html"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>Search</a><a class="" href="create.html"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>Create</a><a class="" href="messages.html"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-5 3v-3.5a2 2 0 0 1-2-2v-7.5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>Messages</a><a class="" href="profile.html"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 20c.7-4 2.9-6 6.5-6s5.8 2 6.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>Profile</a></nav>
<script>
let posts=JSON.parse(localStorage.getItem("bb_posts")||"[]");
// Remove old demo/seed content from earlier versions. Only real user-created posts remain.
const demoUsers=new Set(["Thank God","Alex Morgan","Alex","Maria"]);
posts=posts.filter(p=>p && !demoUsers.has(p.user) && !p.art);
localStorage.setItem("bb_posts",JSON.stringify(posts));
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){localStorage.setItem("bb_posts",JSON.stringify(posts))}
function render(){
 document.getElementById("feed").innerHTML=posts.map((p,i)=>`<article class="post">
 <div class="post-head"><div class="big-avatar">${esc(p.initial||p.user[0])}</div><div><div class="post-user">${esc(p.user)}</div><div class="post-time">${esc(p.time)}</div></div></div>
 <div class="post-media">${p.art?productArt:(p.image?`<img src="${esc(p.image)}" alt="Post image">`:`<div style="font-size:100px">${esc(p.emoji||"✦")}</div>`)}</div>
 <div class="post-body"><div class="post-actions">
 <button class="${p.liked?"liked":""}" onclick="likePost(${i})" aria-label="Like">♡</button>
 <button onclick="commentPost(${i})" aria-label="Comment">◯</button>
 <button onclick="sharePost()" aria-label="Share">↗</button></div>
 <div class="likes">${p.likes||0} like${(p.likes||0)==1?"":"s"}</div>
 ${p.text?`<div class="caption"><b>${esc(p.user)}</b> ${esc(p.text)}</div>`:""}</div></article>`).join("");
}
function likePost(i){posts[i].liked=!posts[i].liked;posts[i].likes=Math.max(0,(posts[i].likes||0)+(posts[i].liked?1:-1));save();render()}
function commentPost(i){const c=prompt("Write a comment:");if(c){localStorage.setItem("bb_last_comment",c);alert("Comment added.");}}
function sharePost(){if(navigator.clipboard)navigator.clipboard.writeText(location.href);alert("Business Bridge link copied.")}
render();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));}</script></body></html>
