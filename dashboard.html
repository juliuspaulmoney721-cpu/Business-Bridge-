<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home — Pixora</title><link rel="stylesheet" href="styles.css"><style>
.post-head{position:relative}.post-menu{margin-left:auto;display:flex;gap:6px}.post-menu .btn{padding:8px 11px;font-size:13px}.post-menu .danger{background:#fff0f0;color:#c62828}.edit-preview{max-width:100%;max-height:260px;border-radius:14px;display:block;margin:10px 0}.edit-file{margin-top:8px}
</style></head><body>
<header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a class="active" href="dashboard.html">⌂</a><a href="search.html">⌕</a><a href="create.html">＋</a><a href="messages.html">▢</a><a href="notifications.html">♧</a></nav><a class="avatar" data-user-avatar href="profile.html">?</a></header>
<main class="container"><div id="feed"><div class="status">Loading your feed...</div></div></main>
<nav class="bottom-nav"><a class="active" href="dashboard.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>▢</span>Messages</a><a href="profile.html"><span>◯</span>Profile</a></nav>
<div id="editModal" class="modal"><div class="sheet"><h2>Edit post</h2><div class="field"><label>Caption</label><textarea id="editContent" rows="5" placeholder="Write something..."></textarea></div><div id="currentImage"></div><div class="field"><label>Change photo</label><input id="editImage" class="edit-file" type="file" accept="image/*"></div><label style="display:flex;gap:8px;align-items:center;margin:12px 0"><input id="removeImage" type="checkbox"> Remove photo</label><div style="display:flex;gap:10px"><button class="btn secondary" id="cancelEdit">Cancel</button><button class="btn accent" id="saveEdit">Save changes</button></div><p id="editStatus" class="status"></p></div></div>
<script type="module">
import{listPosts,currentUser,uploadImage,updatePost,deletePost,deletePostImage}from'./pixora-api.js';
const esc=s=>window.pixoraEsc?.(s)||String(s??'');let me,editing=null;
const $=id=>document.getElementById(id);
const avatar=p=>p?.avatar_url?`<img class="post-avatar avatar-photo" src="${esc(p.avatar_url)}" alt="">`:`<div class="post-avatar big-avatar">${esc((p?.name||'?')[0].toUpperCase())}</div>`;
function postActions(p){return me?.id===p.author_id?`<div class="post-menu"><button class="btn secondary edit-post" data-id="${esc(p.id)}">Edit</button><button class="btn danger delete-post" data-id="${esc(p.id)}">Delete</button></div>`:''}
async function render(){try{me=await currentUser();const posts=await listPosts();const feed=$('feed');if(!posts.length){feed.innerHTML='<div class="empty"><div class="empty-icon">✦</div><h2>Your feed is empty</h2><p>Create your first post to get started.</p><br><a class="btn accent" href="create.html">Create a post</a></div>';return}feed.innerHTML=posts.map(p=>`<article class="post"><div class="post-head">${avatar(p.profile)}<div><div class="post-user">${esc(p.profile?.name||'Pixora User')}</div><div class="post-time">@${esc(p.profile?.username||'user')} · ${new Date(p.created_at).toLocaleString()}</div></div>${postActions(p)}</div>${p.image_url?`<div class="post-media"><img src="${esc(p.image_url)}" alt="Post image"></div>`:''}<div class="post-body"><div class="caption">${esc(p.content||'')}</div></div></article>`).join('');bindActions()}catch(e){$('feed').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
function bindActions(){document.querySelectorAll('.edit-post').forEach(b=>b.onclick=()=>openEdit(b.dataset.id));document.querySelectorAll('.delete-post').forEach(b=>b.onclick=()=>removePost(b.dataset.id))}
async function openEdit(id){const posts=await listPosts();editing=posts.find(p=>String(p.id)===String(id));if(!editing)return; $('editContent').value=editing.content||'';$('editImage').value='';$('removeImage').checked=false;$('currentImage').innerHTML=editing.image_url?`<img class="edit-preview" src="${esc(editing.image_url)}" alt="Current photo">`:'<div class="muted">This post has no photo.</div>';$('editStatus').textContent='';$('editModal').classList.add('open')}
async function removePost(id){if(!confirm('Delete this post? This cannot be undone.'))return;try{const posts=await listPosts();const p=posts.find(x=>String(x.id)===String(id));await deletePost(id);if(p?.image_url)await deletePostImage(p.image_url);await render()}catch(e){alert(e.message)}}
$('cancelEdit').onclick=()=>$('editModal').classList.remove('open');
$('saveEdit').onclick=async()=>{if(!editing)return;const b=$('saveEdit'),s=$('editStatus');b.disabled=true;s.textContent='Saving...';try{let imageUrl=editing.image_url||'';const file=$('editImage').files[0];if($('removeImage').checked)imageUrl='';else if(file)imageUrl=await uploadImage(file,'posts');await updatePost(editing.id,{content:$('editContent').value,imageUrl});if(editing.image_url&&imageUrl!==editing.image_url)await deletePostImage(editing.image_url);$('editModal').classList.remove('open');editing=null;await render()}catch(e){s.textContent=e.message||'Could not update post'}finally{b.disabled=false}};
render();
</script><script type="module" src="app.js"></script></body></html>
