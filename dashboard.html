<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Business Bridge — Home</title>
<style>
:root{--bg:#000;--card:#0b0b0d;--line:#25252a;--text:#f7f7f8;--muted:#888891;--accent:#c04cff;--accent2:#8d38ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body{padding-bottom:82px}a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}
.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:26px;position:sticky;top:0;background:#000;z-index:20}.brand{font-size:29px;font-weight:800;color:var(--accent);letter-spacing:-1.5px}.topnav{display:flex;align-items:center;gap:25px;flex:1}.topnav a{font-size:26px;color:#aaa}.topnav a.active,.topnav a:hover{color:var(--accent)}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#170b20;border:1px solid #3c204b;color:var(--accent);font-weight:700}
.container{width:min(760px,100%);margin:auto;padding:18px}.stories{display:flex;gap:22px;overflow:auto;padding:18px 0 25px;border-bottom:1px solid var(--line)}.story{min-width:78px;text-align:center;color:#9b9ba2;font-size:13px}.story-ring{width:66px;height:66px;border-radius:50%;padding:2px;margin:auto auto 8px;background:linear-gradient(135deg,var(--accent),var(--accent2))}.story-inner{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:#111116;border:2px solid #050505;color:var(--accent);font-size:23px;font-weight:700}.story.add .story-inner{font-size:30px}
.feed{display:flex;flex-direction:column;gap:20px;margin-top:20px}.post{background:var(--card);border:1px solid var(--line);overflow:hidden}.post-head{display:flex;align-items:center;gap:11px;padding:15px}.post-user{font-size:17px;font-weight:700}.post-time{font-size:13px;color:var(--muted);margin-top:3px}.post-media{width:100%;aspect-ratio:1/1;display:grid;place-items:center;background:#101012;overflow:hidden}.post-media svg{width:100%;height:100%;display:block}.post-body{padding:12px 15px 18px}.post-actions{display:flex;gap:24px;font-size:28px;color:#c7c7cc}.post-actions button{border:0;background:transparent;color:inherit;padding:0}.post-actions button.liked{color:var(--accent)}.likes{font-weight:700;margin:11px 0 7px}.caption{color:#ddd;line-height:1.45}.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:82px;background:#050505;border-top:1px solid var(--line);display:flex;z-index:30}.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#777780;font-size:12px}.bottom-nav a span{font-size:27px;line-height:1}.bottom-nav a.active{color:var(--accent)}
@media(min-width:800px){.bottom-nav{display:none}.topbar{padding:0 max(18px,calc((100vw - 1100px)/2))}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="dashboard.html">Pixora</a>
  <nav class="topnav">
    <a class="active" href="dashboard.html" title="Home">⌂</a>
    <a href="search.html" title="Search">⌕</a>
    <a href="create.html" title="Create">⊞</a>
    <a href="messages.html" title="Messages">□</a>
    <a href="notifications.html" title="Notifications">♧</a>
  </nav>
  <a class="avatar" id="topAvatar" href="profile.html">J</a>
</header>

<main class="container">
  <section class="stories">
    <div class="story add"><div class="story-ring"><div class="story-inner">+</div></div><div>Your story</div></div>
    <div class="story"><div class="story-ring"><div class="story-inner">T</div></div><div>Thank God</div></div>
    <div class="story"><div class="story-ring"><div class="story-inner">A</div></div><div>Alex</div></div>
    <div class="story"><div class="story-ring"><div class="story-inner">M</div></div><div>Maria</div></div>
  </section>
  <section id="feed" class="feed"></section>
</main>

<nav class="bottom-nav">
  <a class="active" href="dashboard.html"><span>⌂</span>Home</a>
  <a href="search.html"><span>⌕</span>Search</a>
  <a href="create.html"><span>⊞</span>Create</a>
  <a href="messages.html"><span>□</span>Messages</a>
  <a href="profile.html"><span>●</span>Profile</a>
</nav>

<script>
const productArt=`<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Black T-shirt product post"><rect width="800" height="800" fill="#f5f5f5"/><path d="M175 135 285 80h230l110 55 95 150-95 65-50-90v430H225V260l-50 90-95-65z" fill="#090b10"/><path d="M310 80c12 55 35 80 90 80s78-25 90-80" fill="none" stroke="#191b21" stroke-width="20"/><text x="400" y="380" text-anchor="middle" fill="#fff" font-family="Arial" font-size="65" font-weight="700">I LOVE</text><text x="400" y="455" text-anchor="middle" fill="#fff" font-family="Arial" font-size="78" font-weight="800">MY WIFE</text><text x="400" y="505" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19">LETS ME PLAY DISC GOLF</text></svg>`;
const seed=[{user:'Thank God',initial:'T',time:'14 days ago',likes:1,liked:false,art:true},{user:'Julius Oghenero',initial:'J',time:'Today',text:'Building connections and creating new opportunities through Business Bridge.',likes:0,liked:false,emoji:'✦'}];
function getPosts(){try{return JSON.parse(localStorage.getItem('bb_posts_home')||'null')||seed}catch(e){return seed}}
function savePosts(p){localStorage.setItem('bb_posts_home',JSON.stringify(p))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const posts=getPosts();document.getElementById('feed').innerHTML=posts.map((p,i)=>`<article class="post"><div class="post-head"><div class="avatar">${esc(p.initial||p.user?.[0]||'J')}</div><div><div class="post-user">${esc(p.user||'Business Bridge')}</div><div class="post-time">${esc(p.time||'Just now')}</div></div></div><div class="post-media">${p.art?productArt:(p.image?`<img src="${esc(p.image)}" style="width:100%;height:100%;object-fit:cover" alt="Post image">`:`<div style="font-size:90px">${esc(p.emoji||'✦')}</div>`)}</div><div class="post-body"><div class="post-actions"><button class="${p.liked?'liked':''}" onclick="likePost(${i})">♡</button><button onclick="alert('Comments are ready.')">○</button><button onclick="sharePost()">↗</button></div><div class="likes">${p.likes||0} like${(p.likes||0)==1?'':'s'}</div>${p.text?`<div class="caption"><b>${esc(p.user)}</b> ${esc(p.text)}</div>`:''}</div></article>`).join('')}
function likePost(i){const p=getPosts();p[i].liked=!p[i].liked;p[i].likes=Math.max(0,(p[i].likes||0)+(p[i].liked?1:-1));savePosts(p);render()}
function sharePost(){if(navigator.clipboard)navigator.clipboard.writeText(location.href);alert('Business Bridge link copied.')}
render();
</script>
</body>
</html>
