<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home — Pixora</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a class="active" href="dashboard.html">⌂</a><a href="search.html">⌕</a><a href="create.html">＋</a><a href="messages.html">▢</a><a href="notifications.html">♧</a></nav><a class="avatar" data-user-avatar href="profile.html">?</a></header>
<main class="container"><div id="feed"><div class="status">Loading your feed...</div></div></main>
<nav class="bottom-nav"><a class="active" href="dashboard.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>▢</span>Messages</a><a href="profile.html"><span>◯</span>Profile</a></nav>
<script type="module">
import {listPosts} from './pixora-api.js';
const esc=s=>window.pixoraEsc?.(s)||String(s??'');
const avatar=p=>p?.avatar_url?`<img class="post-avatar avatar-photo" src="${esc(p.avatar_url)}" alt="">`:`<div class="post-avatar big-avatar">${esc((p?.name||'?')[0].toUpperCase())}</div>`;
async function render(){try{const posts=await listPosts();const feed=document.getElementById('feed');if(!posts.length){feed.innerHTML='<div class="empty"><div class="empty-icon">✦</div><h2>Your feed is empty</h2><p>Create your first post to get started.</p><br><a class="btn accent" href="create.html">Create a post</a></div>';return}feed.innerHTML=posts.map(p=>`<article class="post"><div class="post-head">${avatar(p.profile)}<div><div class="post-user">${esc(p.profile?.name||'Pixora User')}</div><div class="post-time">@${esc(p.profile?.username||'user')} · ${new Date(p.created_at).toLocaleString()}</div></div></div>${p.image_url?`<div class="post-media"><img src="${esc(p.image_url)}" alt="Post image"></div>`:''}<div class="post-body"><div class="caption">${esc(p.content||'')}</div></div></article>`).join('')}catch(e){document.getElementById('feed').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
render();
</script><script type="module" src="app.js"></script></body></html>
