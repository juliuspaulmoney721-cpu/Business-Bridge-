<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Messages — Pixora</title><link rel="stylesheet" href="styles.css"><style>
.message-page{max-width:760px;margin:0 auto}.conversation{display:flex;align-items:center;gap:14px;padding:16px 8px;border-bottom:1px solid #eee;cursor:pointer}.conversation:hover{background:#faf7ff}.conv-avatar{width:54px;height:54px;border-radius:50%;background:#eee4f7;color:#913bd2;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}.conv-avatar img{width:100%;height:100%;object-fit:cover}.conv-copy{min-width:0;flex:1}.conv-copy b{display:block;font-size:17px}.conv-copy span{display:block;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.conv-time{font-size:12px;color:#999;white-space:nowrap}.setup-error{margin:18px 0;padding:16px;border:1px solid #f0c9ff;border-radius:16px;background:#fff8ff}.setup-error strong{display:block;margin-bottom:6px}.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:12px;background:#a83cff;color:#fff;font-size:12px;font-weight:700;margin-left:5px}
</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a href="search.html">⌕</a><a href="create.html">＋</a><a class="active" href="messages.html">♡</a><a href="notifications.html">♧</a></nav><a class="avatar" id="headAvatar" href="profile.html">J</a></header><main class="container message-page"><h1 class="page-title">Messages</h1><div id="error"></div><div id="list"></div></main><nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a class="active" href="messages.html"><span>♡</span>Messages</a><a href="profile.html"><span>◯</span>Profile</a></nav><script type="module">
import {ensureProfile,getConversations,localMe} from './pixora-cloud.js';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const init=s=>(String(s||'?').trim()[0]||'?').toUpperCase();
const ago=d=>{const n=Math.max(1,Math.floor((Date.now()-new Date(d).getTime())/1000));if(n<60)return 'now';if(n<3600)return Math.floor(n/60)+'m';if(n<86400)return Math.floor(n/3600)+'h';return Math.floor(n/86400)+'d'};
async function render(){try{await ensureProfile();const p=localMe();document.getElementById('headAvatar').innerHTML=p.avatar?`<img class="avatar-photo" src="${esc(p.avatar)}" alt="">`:init(p.name);const rows=await getConversations();document.getElementById('error').innerHTML='';document.getElementById('list').innerHTML=rows.length?rows.map(r=>`<div class="conversation" onclick="location.href='chat.html?user=${encodeURIComponent(r.profile.id)}'"><div class="conv-avatar">${r.profile.avatar?`<img src="${esc(r.profile.avatar)}" alt="">`:init(r.profile.name)}</div><div class="conv-copy"><b>${esc(r.profile.name)}</b><span>${esc(r.message?.body||'Start a conversation')}</span></div><div class="conv-time">${r.message?.created_at?ago(r.message.created_at):''}</div></div>`).join(''):`<div class="empty"><div class="empty-icon">♡</div><h2>No messages yet</h2><p>Search for someone and tap Message to start a conversation.</p></div>`}catch(e){document.getElementById('list').innerHTML='';document.getElementById('error').innerHTML=`<div class="setup-error"><strong>Messages need one database setup step.</strong>${esc(e.message)}<br><br>Open <b>schema.sql</b> from this ZIP and run the whole file in your Supabase SQL Editor.</div>`}}
render();window.addEventListener('focus',render);setInterval(render,5000);
</script><script type="module" src="app.js"></script></body></html>
