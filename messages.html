<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Messages — Pixora</title><link rel="stylesheet" href="styles.css"><style>.conversation{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid #eee;cursor:pointer}.conversation:hover{background:#faf7ff}.conv-avatar{width:54px;height:54px;border-radius:50%;background:#eee4f7;color:#913bd2;display:grid;place-items:center;font-weight:700;overflow:hidden}.conv-avatar img{width:100%;height:100%;object-fit:cover}.conv-copy{min-width:0;flex:1}.conv-copy b{display:block;font-size:17px}.conv-copy span{display:block;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.empty{padding-top:80px}</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a href="search.html">⌕</a><a href="create.html">＋</a><a class="active" href="messages.html">♡</a><a href="notifications.html">♧</a></nav><a class="avatar" href="profile.html" id="headAvatar">J</a></header><main class="container"><h1 class="page-title">Messages</h1><div id="list"></div></main><nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a class="active" href="messages.html"><span>♡</span>Messages</a><a href="profile.html"><span>◯</span>Profile</a></nav><script type="module">
import {ensureProfile,getConversations,localMe} from './pixora-cloud.js';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const init=s=>(String(s||'?').trim()[0]||'?').toUpperCase();
async function render(){await ensureProfile();const p=localMe();document.getElementById('headAvatar').textContent=init(p.name);const rows=await getConversations();document.getElementById('list').innerHTML=rows.length?rows.map(r=>`<div class="conversation" onclick="location.href='chat.html?user=${encodeURIComponent(r.profile.id)}&name=${encodeURIComponent(r.profile.name)}'"><div class="conv-avatar">${r.profile.avatar?`<img src="${esc(r.profile.avatar)}">`:init(r.profile.name)}</div><div class="conv-copy"><b>${esc(r.profile.name)}</b><span>${esc(r.message?.body||'Start a conversation')}</span></div></div>`).join(''):`<div class="empty"><div class="empty-icon">♡</div><h2>No messages yet</h2><p>Search for someone and tap Message to start a conversation.</p></div>`}
render();window.addEventListener('focus',render);
</script><script type="module" src="app.js"></script></body></html>
