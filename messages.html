<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages — Pixora</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a href="search.html">⌕</a><a href="create.html">＋</a><a class="active" href="messages.html">▢</a><a href="notifications.html">♧</a></nav><a class="avatar" data-user-avatar href="profile.html">?</a></header>
<main class="container"><h1 class="page-title">Messages</h1><div id="list"><div class="status">Loading messages...</div></div></main>
<nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a class="active" href="messages.html"><span>▢</span>Messages</a><a href="profile.html"><span>◯</span>Profile</a></nav>
<script type="module">import{listConversations}from'./pixora-api.js';const esc=s=>window.pixoraEsc?.(s)||String(s??'');async function render(){try{const rows=await listConversations();document.getElementById('list').innerHTML=rows.length?rows.map(x=>`<a class="profile-card person" href="chat.html?user=${encodeURIComponent(x.user.username)}">${x.user.avatar_url?`<img class="big-avatar avatar-photo" src="${esc(x.user.avatar_url)}">`:`<div class="big-avatar">${esc((x.user.name||'?')[0].toUpperCase())}</div>`}<div style="flex:1"><b>${esc(x.user.name)}</b><div class="muted">${esc(x.last?.content||'Start chatting')}</div></div><small class="muted">${x.last?new Date(x.last.created_at).toLocaleDateString():''}</small></a>`).join(''):'<div class="empty"><div class="empty-icon">▢</div><h2>No messages yet</h2><p>Search for someone and tap Message to start a conversation.</p><br><a class="btn accent" href="search.html">Find people</a></div>'}catch(e){document.getElementById('list').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}render();</script><script type="module" src="app.js"></script></body></html>
