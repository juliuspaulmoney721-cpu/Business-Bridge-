<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business Bridge AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef3fb;
display:flex;
flex-direction:column;
height:100vh;
}

header{
background:#12355b;
color:white;
padding:18px;
font-size:26px;
font-weight:bold;
text-align:center;
}

#chat{
flex:1;
overflow-y:auto;
padding:20px;
}

.message{
padding:12px 16px;
margin-bottom:15px;
border-radius:12px;
max-width:80%;
line-height:1.5;
}

.user{
background:#12355b;
color:white;
margin-left:auto;
}

.ai{
background:white;
color:#222;
border:1px solid #ddd;
}

.bottom{
display:flex;
padding:15px;
background:white;
gap:10px;
border-top:1px solid #ddd;
}

input{
flex:1;
padding:14px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

button{
background:#12355b;
color:white;
border:none;
padding:14px 22px;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0d2743;
}

</style>

</head>

<body>

<header>
🤖 Business Bridge AI
</header>

<div id="chat">

<div class="message ai">
Hello 👋<br><br>
Welcome to Business Bridge AI.<br>
Ask me anything.
</div>

</div>

<div class="bottom">

<input
id="prompt"
type="text"
placeholder="Type your message..."
>

<button id="sendBtn">
Send
</button>

</div>

<script>

const chat=document.getElementById("chat");

document.getElementById("sendBtn").onclick=function(){

const input=document.getElementById("prompt");

if(input.value.trim()=="") return;

chat.innerHTML+=`

<div class="message user">
${input.value}
</div>

`;

const text=input.value;

input.value="";

setTimeout(()=>{

chat.innerHTML+=`

<div class="message ai">

You said:<br><br>

${text}

<br><br>

✅ AI connection coming next.

</div>

`;

chat.scrollTop=chat.scrollHeight;

},600);

chat.scrollTop=chat.scrollHeight;

};

</script>

</body>
</html>
