<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Business Bridge AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
display:flex;
flex-direction:column;
height:100vh;
}

header{
background:#12355b;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

#chat{
flex:1;
overflow-y:auto;
padding:20px;
}

.message{
max-width:80%;
padding:14px;
margin-bottom:15px;
border-radius:12px;
line-height:1.5;
word-wrap:break-word;
}

.user{
margin-left:auto;
background:#12355b;
color:white;
}

.ai{
background:white;
border:1px solid #ddd;
color:#222;
}

.bottom{
display:flex;
padding:15px;
gap:10px;
background:white;
border-top:1px solid #ddd;
}

textarea{
flex:1;
height:60px;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
resize:none;
}

button{
background:#12355b;
color:white;
border:none;
padding:15px 25px;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0d2743;
}

</style>

</head>

<body>

<header>

🤖 Business Bridge AI

</header>

<div id="chat">

<div class="message ai">

Hello 👋

<br><br>

I am your Business Bridge AI assistant.

Ask me anything about business, coding, marketing, studying or life.

</div>

</div>

<div class="bottom">

<textarea
id="prompt"
placeholder="Ask anything..."
></textarea>

<button id="sendBtn">

Send

</button>

</div>

<script type="module">

import { supabase } from "./supabase.js";

const chat=document.getElementById("chat");

const prompt=document.getElementById("prompt");

const send=document.getElementById("sendBtn");

send.onclick=async()=>{

const text=prompt.value.trim();

if(text=="") return;

chat.innerHTML+=`

<div class="message user">

${text}

</div>

`;

prompt.value="";

chat.innerHTML+=`

<div class="message ai" id="thinking">

⏳ Thinking...

</div>

`;

const thinking=document.getElementById("thinking");

try{

const { data, error } = await supabase.functions.invoke("Chat-",{
body:{
  message:text
}
});

if(error) throw error;

thinking.innerHTML=data.reply;

}catch(err){

thinking.innerHTML="❌ "+err.message;

}

chat.scrollTop=chat.scrollHeight;

};

prompt.addEventListener("keypress",(e)=>{

if(e.key==="Enter" && !e.shiftKey){

e.preventDefault();

send.click();

}

});

</script>

</body>

</html>
