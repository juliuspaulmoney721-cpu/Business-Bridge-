<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zen AI - Business Bridge</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #09070d;
    color: white;
    min-height: 100vh;
}

header {
    background: #12091c;
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #39204d;
}

.logo {
    font-size: 30px;
    font-weight: bold;
}

.logo span {
    color: #b83cff;
}

.subtitle {
    color: #aaa;
    margin-top: 5px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 25px 18px 100px;
}

.hero {
    text-align: center;
    padding: 25px 0;
}

.zen-icon {
    width: 80px;
    height: 80px;
    border: 3px solid #b83cff;
    border-radius: 50%;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
    background: #1c0d29;
}

.hero h1 {
    margin-top: 18px;
    font-size: 36px;
}

.hero h1 span {
    color: #b83cff;
}

.hero p {
    color: #aaa;
    margin-top: 8px;
    font-size: 17px;
}

.chat-box {
    background: #151018;
    border: 1px solid #39204d;
    border-radius: 20px;
    padding: 20px;
    min-height: 230px;
    margin-top: 20px;
}

.welcome {
    color: #ddd;
    line-height: 1.6;
}

.welcome strong {
    color: #c653ff;
}

.quick-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
}

.quick-buttons button {
    background: #21132d;
    color: white;
    border: 1px solid #593074;
    border-radius: 12px;
    padding: 15px 8px;
    font-size: 14px;
    cursor: pointer;
}

.quick-buttons button:hover {
    background: #38204b;
}

.input-area {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.input-area input {
    flex: 1;
    background: #151018;
    color: white;
    border: 1px solid #593074;
    border-radius: 14px;
    padding: 16px;
    font-size: 15px;
    outline: none;
}

.input-area button {
    background: #a934e8;
    color: white;
    border: none;
    border-radius: 14px;
    padding: 0 20px;
    font-weight: bold;
    cursor: pointer;
}

.input-area button:hover {
    background: #c653ff;
}

footer {
    text-align: center;
    color: #777;
    padding: 25px;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
<div class="logo"><span>ZEN</span></div>
<div class="subtitle">Business Bridge Intelligent Assistant</div>
</header>

<div class="container">

    <section class="hero">
        <div class="zen-icon">Z</div>

        <h1>Meet <span>Zen AI</span></h1>

        <p>
            Your intelligent assistant for business, ideas,
            technology and growth.
        </p>
    </section>

    <div class="chat-box" id="chatBox">

        <div class="welcome">
            👋 <strong>Hello, I'm Zen.</strong><br><br>

            I'm here to help you build, create, learn and grow.
            Ask me a question or choose one of the options below.
        </div>

        <div class="quick-buttons">
            <button onclick="askZen('Help me with my business')">
                💼 Business Help
            </button>

            <button onclick="askZen('Give me a business idea')">
                💡 Business Ideas
            </button>

            <button onclick="askZen('Help me build an app')">
                📱 Build an App
            </button>

            <button onclick="askZen('Help me with marketing')">
                📣 Marketing
            </button>

            <button onclick="askZen('Help me create a website')">
                🌐 Website Help
            </button>

            <button onclick="askZen('Help me understand trading')">
                📈 Trading Help
            </button>
        </div>

    </div>

    <div class="input-area">
        <input
            type="text"
            id="userInput"
            placeholder="Ask Zen anything..."
            onkeypress="handleKey(event)"
        >

        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<footer>
    © 2026 Business Bridge • Powered by Zen AI
</footer>

<script>

function sendMessage() {

    const input = document.getElementById("userInput");
    const message = input.value.trim();

    if (message === "") {
        return;
    }

    askZen(message);
    input.value = "";
}

function handleKey(event) {

    if (event.key === "Enter") {
        sendMessage();
    }
}

function askZen(message) {

    const chatBox = document.getElementById("chatBox");

    const userMessage = document.createElement("div");

    userMessage.style.marginTop = "20px";
    userMessage.style.padding = "12px";
    userMessage.style.background = "#2a1738";
    userMessage.style.borderRadius = "12px";

    userMessage.innerHTML = "<strong>You:</strong><br>" + message;

    chatBox.appendChild(userMessage);

    const zenMessage = document.createElement("div");

    zenMessage.style.marginTop = "12px";
    zenMessage.style.padding = "12px";
    zenMessage.style.background = "#151018";
    zenMessage.style.borderRadius = "12px";
    zenMessage.style.color = "#ddd";

    zenMessage.innerHTML =
        "<strong style='color:#c653ff'>Zen:</strong><br>" +
        "I'm ready to help you with that. The AI connection will be added next.";

    chatBox.appendChild(zenMessage);

    chatBox.scrollTop = chatBox.scrollHeight;
}

</script>

</body>
</html>
