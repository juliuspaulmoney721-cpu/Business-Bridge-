<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chat — Pixora</title><link rel="stylesheet" href="styles.css"><style>.chat-wrap{max-width:760px;margin:auto}.chat-head{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.back{font-size:28px}.chat-avatar{width:46px;height:46px;border-radius:50%;background:#eee4f7;color:#913bd2;display:grid;place-items:center;font-weight:700}.chat-list{min-height:58vh;padding:18px 0 100px}.bubble{max-width:78%;padding:11px 14px;border-radius:18px;margin:8px 0;line-height:1.4;word-break:break-word}.mine{margin-left:auto;background:#a83cff;color:white;border-bottom-right-radius:5px}.theirs{margin-right:auto;background:#f1f1f3;color:#111;border-bottom-left-radius:5px}.composer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #eee;padding:12px;display:flex;gap:8px;z-index:20}.composer-inner{max-width:760px;margin:auto;display:flex;gap:8px;width:100%}.composer input{flex:1;border:1px solid #ddd;border-radius:24px;padding:12px 15px;font-size:16px}.composer button{border:0;background:#a83cff;color:#fff;border-radius:24px;padding:0 20px;font-weight:700}</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a href="search.html">⌕</a><a href="create.html">＋</a><a class="active" href="messages.html">♡</a><a href="notifications.html">♧</a></nav><a class="avatar" href="profile.html">J</a></header><main class="container chat-wrap"><div class="chat-head"><a class="back" href="messages.html">‹</a><div class="chat-avatar" id="avatar">?</div><div><b id="name">Chat</b><div class="muted" id="username"></div></div></div><div id="chat" class="chat-list"></div></main><div class="composer"><div class="composer-inner"><input id="body" placeholder="Write a message..." maxlength="5000"><button id="send">Send</button></div></div><script type="module">
import {ensureProfile,user,getConversation,sendMessage,findProfiles} from './pixora-cloud.js';
const params=new URLSearchParams(location.search),id=params.get('user');let recipient=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const init=s=>(String(s||'?').trim()[0]||'?').toUpperCase();
async function setup(){await ensureProfile();const profiles=await findProfiles('');recipient=profiles.find(p=>p.id===id);if(!recipient){alert('User not found.');location.href='search.html';return}document.getElementById('name').textContent=recipient.name;document.getElementById('username').textContent='@'+recipient.username;document.getElementById('avatar').textContent=init(recipient.name);render()}
async function render(){const u=await user(),rows=await getConversation(id);document.getElementById('chat').innerHTML=rows.length?rows.map(m=>`<div class="bubble ${m.sender_id===u.id?'mine':'theirs'}">${esc(m.body)}</div>`).join(''):'<div class="empty"><h2>Start the conversation</h2><p>Send the first message.</p></div>';window.scrollTo(0,document.body.scrollHeight)}
async function send(){const input=document.getElementById('body'),text=input.value.trim();if(!text)return;document.getElementById('send').disabled=true;try{await sendMessage(recipient,text);input.value='';await render()}catch(e){alert(e.message||'Message could not be sent.')}finally{document.getElementById('send').disabled=false}}
document.getElementById('send').onclick=send;document.getElementById('body').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});setup();setInterval(render,4000);
</script><script type="module" src="app.js"></script></body></html>
