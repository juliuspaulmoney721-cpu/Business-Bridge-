<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat — Pixora</title><link rel="stylesheet" href="styles.css"><style>.chat-page{height:calc(100vh - 154px);display:flex;flex-direction:column}.chat-head{display:flex;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}.chat-head .back{font-size:28px}.chat-messages{flex:1;overflow:auto;padding:18px 0}.bubble{max-width:78%;padding:11px 14px;border-radius:18px;margin:7px 0;line-height:1.4}.mine{margin-left:auto;background:#a83cff;color:#fff;border-bottom-right-radius:5px}.theirs{background:#f1f1f3;border-bottom-left-radius:5px}.chat-form{display:flex;gap:10px;padding:12px 0;background:#fff}.chat-form input{flex:1;border:1px solid #ddd;border-radius:24px;padding:14px 18px}</style></head><body>
<header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a href="search.html">⌕</a><a href="create.html">＋</a><a class="active" href="messages.html">▢</a><a href="notifications.html">♧</a></nav><a class="avatar" data-user-avatar href="profile.html">?</a></header>
<main class="container chat-page"><div id="head" class="chat-head"><a class="back" href="messages.html">‹</a><div class="status">Loading...</div></div><div id="messages" class="chat-messages"></div><form id="form" class="chat-form"><input id="body" placeholder="Write a message..." autocomplete="off"><button class="btn accent">Send</button></form></main>
<nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a class="active" href="messages.html"><span>▢</span>Messages</a><a href="profile.html"><span>◯</span>Profile</a></nav>
<script type="module">import{currentUser,getProfileById,getProfileByUsername,listMessages,sendMessage}from'./pixora-api.js';import{supabase}from'./supabase.js';const esc=s=>window.pixoraEsc?.(s)||String(s??'');const params=new URLSearchParams(location.search);const userId=params.get('id');const username=params.get('user');let other,me;async function render(){const rows=await listMessages(other.id);document.getElementById('messages').innerHTML=rows.map(m=>`<div class="bubble ${m.sender_id===me.id?'mine':'theirs'}">${esc(m.content)}<div style="font-size:11px;opacity:.7;margin-top:4px">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>`).join('');const box=document.getElementById('messages');box.scrollTop=box.scrollHeight}async function init(){try{me=await currentUser();other=userId?await getProfileById(userId):await getProfileByUsername(username||'');if(!other||other.id===me.id)throw new Error('User not found.');try{const key='pixora_recent_conversations',current=JSON.parse(localStorage.getItem(key)||'[]');localStorage.setItem(key,JSON.stringify([other.id,...current.filter(id=>id!==other.id)].slice(0,50)))}catch{}document.getElementById('head').innerHTML=`<a class="back" href="messages.html">‹</a>${other.avatar_url?`<img class="big-avatar avatar-photo" src="${esc(other.avatar_url)}">`:`<div class="big-avatar">${esc((other.name||'?')[0].toUpperCase())}</div>`}<div><b>${esc(other.name)}</b><div class="muted">@${esc(other.username)}</div></div>`;await render();supabase.channel('chat-'+[me.id,other.id].sort().join('-')).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{if(p.new.sender_id===me.id||p.new.sender_id===other.id)render()}).subscribe()}catch(e){alert(e.message);location.href='search.html'}}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('body'),text=input.value.trim();if(!text)return;input.disabled=true;try{await sendMessage(other.id,text);input.value='';await render()}catch(err){alert(err.message)}finally{input.disabled=false;input.focus()}};init();</script><script type="module" src="app.js"></script></body></html>
