<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chat — Pixora</title><link rel="stylesheet" href="styles.css"><style>
.chat-wrap{max-width:760px;margin:auto;padding-bottom:110px}.chat-head{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.back{font-size:32px;text-decoration:none;color:#111}.chat-avatar{width:48px;height:48px;border-radius:50%;background:#eee4f7;color:#913bd2;display:grid;place-items:center;font-weight:700;overflow:hidden}.chat-avatar img{width:100%;height:100%;object-fit:cover}.chat-list{min-height:58vh;padding:18px 0}.bubble{max-width:78%;padding:11px 14px;border-radius:18px;margin:8px 0;line-height:1.4;word-break:break-word}.mine{margin-left:auto;background:#a83cff;color:white;border-bottom-right-radius:5px}.theirs{margin-right:auto;background:#f1f1f3;color:#111;border-bottom-left-radius:5px}.bubble-time{font-size:11px;opacity:.65;margin-top:4px}.composer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #eee;padding:12px;z-index:20}.composer-inner{max-width:760px;margin:auto;display:flex;gap:8px}.composer input{flex:1;min-width:0;border:1px solid #ddd;border-radius:24px;padding:12px 15px;font-size:16px}.composer button{border:0;background:#a83cff;color:#fff;border-radius:24px;padding:0 20px;font-weight:700}.setup-error{margin:18px 0;padding:16px;border:1px solid #f0c9ff;border-radius:16px;background:#fff8ff}.typing{font-size:13px;color:#888;margin:5px 0 0}
</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a href="search.html">⌕</a><a href="create.html">＋</a><a class="active" href="messages.html">♡</a><a href="notifications.html">♧</a></nav><a class="avatar" href="profile.html">J</a></header><main class="container chat-wrap"><div class="chat-head"><a class="back" href="messages.html">‹</a><div class="chat-avatar" id="avatar">?</div><div><b id="name">Chat</b><div class="muted" id="username"></div></div></div><div id="error"></div><div id="chat" class="chat-list"></div></main><div class="composer"><div class="composer-inner"><input id="body" placeholder="Write a message..." maxlength="5000" autocomplete="off"><button id="send">Send</button></div></div><nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a class="active" href="messages.html"><span>♡</span>Messages</a><a href="profile.html"><span>◯</span>Profile</a></nav><script type="module">
import {ensureProfile,user,findProfiles,getConversation,sendMessage,subscribeToConversation,removeChannel} from './pixora-cloud.js';
const params=new URLSearchParams(location.search),id=params.get('user');let recipient=null,channel=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const init=s=>(String(s||'?').trim()[0]||'?').toUpperCase();
const ago=d=>{const n=Math.max(1,Math.floor((Date.now()-new Date(d).getTime())/1000));if(n<60)return 'now';if(n<3600)return Math.floor(n/60)+'m';if(n<86400)return Math.floor(n/3600)+'h';return Math.floor(n/86400)+'d'};
function showError(msg){document.getElementById('error').innerHTML=`<div class="setup-error">${esc(msg)}</div>`}
async function setup(){try{await ensureProfile();if(!id){showError('No recipient was selected. Go back to Search and tap Message.');return}const profiles=await findProfiles('');recipient=profiles.find(p=>p.id===id);if(!recipient){showError('User not found in the Pixora database. Make sure both accounts have logged in once after running schema.sql.');return}document.getElementById('name').textContent=recipient.name;document.getElementById('username').textContent='@'+recipient.username;document.getElementById('avatar').innerHTML=recipient.avatar?`<img src="${esc(recipient.avatar)}" alt="">`:init(recipient.name);await render();channel=subscribeToConversation(id,async row=>{if(row.sender_id===id||row.recipient_id===id)await render()})}catch(e){showError(e.message||'Chat could not be loaded.')}}
async function render(){try{const u=await user(),rows=await getConversation(id);document.getElementById('chat').innerHTML=rows.length?rows.map(m=>`<div class="bubble ${m.sender_id===u.id?'mine':'theirs'}">${esc(m.body)}<div class="bubble-time">${ago(m.created_at)}</div></div>`).join(''):'<div class="empty"><h2>Start the conversation</h2><p>Send the first message.</p></div>';requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight))}catch(e){showError(e.message||'Could not load messages.')}}
async function send(){const input=document.getElementById('body'),btn=document.getElementById('send'),text=input.value.trim();if(!text||!recipient)return;btn.disabled=true;try{await sendMessage(recipient,text);input.value='';await render()}catch(e){showError(e.message||'Message could not be sent.')}finally{btn.disabled=false;input.focus()}}
document.getElementById('send').onclick=send;document.getElementById('body').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});window.addEventListener('beforeunload',()=>channel&&removeChannel(channel));setup();
</script><script type="module" src="app.js"></script></body></html>
