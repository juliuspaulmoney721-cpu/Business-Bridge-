<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Search — Pixora</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a class="active" href="search.html">⌕</a><a href="create.html">＋</a><a href="messages.html">♡</a><a href="notifications.html">♧</a></nav><a class="avatar" id="headAvatar" href="profile.html">J</a></header><main class="container"><h1 class="page-title">Search</h1><div class="searchbox"><input id="q" placeholder="Search people or usernames..."><button class="btn accent" id="go">Search</button></div><div id="results"></div></main><nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a class="active" href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>♡</span>Messages</a><a href="profile.html"><span>◯</span>Profile</a></nav><script src="pixora-data.js"></script><script>function me(){return PixoraData.me()}function initials(n){return(n||'?')[0].toUpperCase()}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function profiles(){return PixoraData.profiles()}function render(){const q=document.getElementById('q').value.trim().toLowerCase(),m=me();const list=profiles().filter(p=>p.username!==m.username&&(!q||p.name.toLowerCase().includes(q)||p.username.toLowerCase().includes(q)));document.getElementById('results').innerHTML=list.length?list.map(p=>`<div class="profile-card"><div class="person">${p.avatar?`<img class="big-avatar avatar-photo" src="${esc(p.avatar)}" alt="Profile picture">`:`<div class="big-avatar">${initials(p.name)}</div>`}<div style="flex:1"><b>${esc(p.name)}</b><div class="muted">@${esc(p.username)}</div></div><button class="btn secondary" onclick="toggleFollow('${esc(p.username)}')">${PixoraData.isFollowing(p.username)?'Following':'Follow'}</button></div></div>`).join(''):'<div class="empty"><div class="empty-icon">⌕</div><h2>No users found</h2><p>Try searching for another name or username.</p></div>'}function toggleFollow(u){PixoraData.toggleFollow(u);render()}document.getElementById('go').onclick=render;document.getElementById('q').addEventListener('input',render);const p=me();document.getElementById('headAvatar').innerHTML=p.avatar?`<img class="topbar-avatar" src="${esc(p.avatar)}" alt="Profile picture">`:initials(p.name);render()</script></script><script type="module" src="app.js"></script></body></html>
