<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Search - Business Bridge</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172b4d;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    header {
      background: white;
      border-bottom: 1px solid #e1e5eb;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: 700;
      color: #203e68;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 18px;
    }

    .title {
      margin-bottom: 8px;
      font-size: 30px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 25px;
      font-size: 16px;
      line-height: 1.5;
    }

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 15px;
      border: 1px solid #e1e5eb;
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .search-box input {
      flex: 1;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #203e68;
    }

    .search-btn {
      border: none;
      background: #203e68;
      color: white;
      padding: 0 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .search-btn:active {
      transform: scale(0.98);
    }

    .filters {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .filter {
      border: 1px solid #d0d5dd;
      background: white;
      padding: 10px 15px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
      color: #475467;
    }

    .filter.active {
      background: #203e68;
      color: white;
      border-color: #203e68;
    }

    #status {
      text-align: center;
      color: #667085;
      margin: 25px 0;
    }

    .results {
      display: grid;
      gap: 15px;
    }

    .profile-card {
      background: white;
      border: 1px solid #e1e5eb;
      border-radius: 15px;
      padding: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .avatar {
      width: 60px;
      height: 60px;
      min-width: 60px;
      border-radius: 50%;
      background: #203e68;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }

    .profile-info {
      flex: 1;
    }

    .profile-info h3 {
      font-size: 19px;
      margin-bottom: 5px;
    }

    .type {
      display: inline-block;
      background: #eef2f7;
      color: #203e68;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .profile-detail {
      color: #52627a;
      font-size: 13px;
      margin: 2px 0 6px;
      font-weight: 600;
    }

    .bio {
      color: #667085;
      line-height: 1.4;
      font-size: 14px;
    }

    .connect-btn {
      border: none;
      background: #203e68;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .empty {
      background: white;
      border: 1px solid #e1e5eb;
      border-radius: 15px;
      padding: 30px 20px;
      text-align: center;
      color: #667085;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 9px 3px;
      z-index: 20;
    }

    .nav-item {
      text-align: center;
      color: #667085;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .nav-item span {
      display: block;
      font-size: 21px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #203e68;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      .search-box {
        padding: 10px;
      }

      .search-btn {
        padding: 0 15px;
      }

      .profile-card {
        align-items: flex-start;
      }

      .connect-btn {
        font-size: 13px;
        padding: 9px 10px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Business Bridge</div>
  </header>


  <main class="container">

    <h1 class="title">Find People & Businesses</h1>

    <p class="subtitle">
      Search for businesses, creators, students and other
      Business Bridge members.
    </p>


    <!-- SEARCH -->

    <div class="search-box">

      <input
        type="search"
        id="searchInput"
        placeholder="Search by name..."
        autocomplete="off"
      >

      <button
        class="search-btn"
        id="searchBtn"
      >
        Search
      </button>

    </div>


    <!-- FILTERS -->

    <div class="filters">

      <button
        class="filter active"
        data-type="all"
      >
        All
      </button>

      <button
        class="filter"
        data-type="business"
      >
        Businesses
      </button>

      <button
        class="filter"
        data-type="creator"
      >
        Creators
      </button>

      <button
        class="filter"
        data-type="student"
      >
        Students
      </button>

    </div>


    <div id="status">
      Loading members...
    </div>


    <section
      class="results"
      id="results"
    ></section>

  </main>


  <!-- BOTTOM NAVIGATION -->

  <nav class="bottom-nav">

    <div
      class="nav-item"
      onclick="goTo('dashboard.html')"
    >
      <span>🏠</span>
      Home
    </div>

    <div class="nav-item active">
      <span>🔎</span>
      Search
    </div>

    <div
      class="nav-item"
      onclick="comingSoon()"
    >
      <span>🤝</span>
      Connect
    </div>

    <div
      class="nav-item"
      onclick="comingSoon()"
    >
      <span>💬</span>
      Messages
    </div>

    <div
      class="nav-item"
      onclick="comingSoon()"
    >
      <span>👤</span>
      Profile
    </div>

  </nav>


  <script type="module">

    import { supabase } from "./supabase.js";


    let currentUser = null;
    let currentType = "all";


    /*
      CHECK LOGIN
    */

    async function checkLogin() {

      const {
        data: { session }
      } = await supabase.auth.getSession();


      if (!session) {

        window.location.href = "login.html";

        return false;
      }


      currentUser = session.user;

      return true;
    }


    /*
      LOAD PROFILES
    */

    async function loadProfiles() {

      const search =
        document
          .getElementById("searchInput")
          .value
          .trim();


      let query =
        supabase
          .from("profiles")
          .select("*")
          .order("full_name", {
            ascending: true
          });


      /*
        SEARCH BY NAME
      */

      if (search) {

        query = query.ilike(
          "full_name",
          "%" + search + "%"
        );

      }


      /*
        ACCOUNT TYPE FILTER
      */

      if (currentType !== "all") {

        query = query.eq(
          "account_type",
          currentType
        );

      }


      /*
        DON'T SHOW YOUR OWN PROFILE
      */

      if (currentUser) {

        query = query.neq(
          "id",
          currentUser.id
        );

      }


      const {
        data,
        error
      } = await query;


      if (error) {

        console.error(error);

        document.getElementById("status").textContent =
          "We couldn't load members yet.";

        document.getElementById("results").innerHTML = `

          <div class="empty">

            <h3>Profiles are not ready yet</h3>

            <p style="margin-top:10px;">
              The search page is ready, but we still need
              to connect the member profiles database.
            </p>

          </div>

        `;

        return;
      }


      displayProfiles(data || []);

    }


    /*
      DISPLAY RESULTS
    */

    function displayProfiles(profiles) {

      const results =
        document.getElementById("results");

      const status =
        document.getElementById("status");


      results.innerHTML = "";


      if (profiles.length === 0) {

        status.textContent = "";

        results.innerHTML = `

          <div class="empty">

            <div style="font-size:40px;">
              🔎
            </div>

            <h3 style="margin-top:10px;">
              No members found
            </h3>

            <p style="margin-top:8px;">
              Try another name or category.
            </p>

          </div>

        `;

        return;
      }


      status.textContent =
        profiles.length +
        " member" +
        (profiles.length === 1 ? "" : "s") +
        " found";


      profiles.forEach(profile => {

        const name =
          profile.full_name ||
          "Business Bridge Member";


        const type =
          profile.account_type ||
          "Member";


        const bio =
          profile.bio ||
          "Business Bridge member";

        // Use an optional public profile detail when available.
        // This helps distinguish members who have the same full name
        // without exposing private account information.
        const profileDetail =
          profile.username ||
          profile.headline ||
          profile.company_name ||
          profile.school_name ||
          "";


        const firstLetter =
          name.charAt(0).toUpperCase();


        const card =
          document.createElement("div");


        card.className =
          "profile-card";


        card.innerHTML = `

          <div class="avatar">
            ${firstLetter}
          </div>

          <div class="profile-info">

            <h3>
              ${escapeHtml(name)}
            </h3>

            <div class="type">
              ${escapeHtml(type)}
            </div>

            ${profileDetail ? `
              <div class="profile-detail">
                ${escapeHtml(profileDetail)}
              </div>
            ` : ""}

            <div class="bio">
              ${escapeHtml(bio)}
            </div>

          </div>

          <button
            class="connect-btn"
            data-id="${profile.id}"
          >
            Connect
          </button>

        `;


        const connectButton =
          card.querySelector(".connect-btn");


        connectButton.addEventListener(
          "click",
          () => sendConnectionRequest(profile.id, connectButton)
        );


        results.appendChild(card);

      });

    }


    /*
      SEND CONNECTION REQUEST
    */

    async function sendConnectionRequest(recipientId, button) {

      if (!currentUser) {

        alert("Please log in first.");
        return;

      }

      if (!recipientId || recipientId === currentUser.id) {

        alert("You cannot connect with yourself.");
        return;

      }

      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = "Checking...";

      try {

        // Check for an existing request in either direction.
        const { data: existing, error: checkError } =
          await supabase
            .from("connections")
            .select("id, requester_id, recipient_id, status")
            .or(
              `and(requester_id.eq.${currentUser.id},recipient_id.eq.${recipientId}),and(requester_id.eq.${recipientId},recipient_id.eq.${currentUser.id})`
            )
            .limit(1);

        if (checkError) {
          throw checkError;
        }

        if (existing && existing.length > 0) {

          const connection = existing[0];

          if (connection.status === "accepted") {
            button.textContent = "Connected";
            return;
          }

          if (connection.status === "pending") {
            button.textContent =
              connection.requester_id === currentUser.id
                ? "Pending"
                : "Requested";
            return;
          }

          if (connection.status === "declined") {
            button.textContent = "Declined";
            return;
          }

        }

        button.textContent = "Sending...";

        const { error: insertError } =
          await supabase
            .from("connections")
            .insert({
              requester_id: currentUser.id,
              recipient_id: recipientId,
              status: "pending"
            });

        if (insertError) {
          // A duplicate request can happen if two taps occur quickly.
          if (insertError.code === "23505") {
            button.textContent = "Pending";
            return;
          }

          throw insertError;
        }

        button.textContent = "Pending";
        button.disabled = true;

      } catch (error) {

        console.error("Connection request error:", error);

        button.disabled = false;
        button.textContent = originalText;

        alert(
          "We couldn't send the connection request. Please try again."
        );

      }

    }


    /*
      SEARCH BUTTON
    */

    document
      .getElementById("searchBtn")
      .addEventListener(
        "click",
        loadProfiles
      );


    /*
      SEARCH WHEN PRESSING ENTER
    */

    document
      .getElementById("searchInput")
      .addEventListener(
        "keydown",
        event => {

          if (event.key === "Enter") {

            loadProfiles();

          }

        }
      );


    /*
      FILTER BUTTONS
    */

    document
      .querySelectorAll(".filter")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".filter")
              .forEach(btn => {

                btn.classList.remove("active");

              });


            button.classList.add("active");


            currentType =
              button.dataset.type;


            loadProfiles();

          }
        );

      });


    /*
      BASIC HTML ESCAPE
    */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      START
    */

    const loggedIn =
      await checkLogin();


    if (loggedIn) {

      loadProfiles();

    }

  </script>


  <script>

    function goTo(page) {

      window.location.href = page;

    }


    function comingSoon() {

      alert(
        "This Business Bridge feature is coming soon."
      );

    }

  </script>

</body>
</html>
