<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Search — Pixora</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a class="active" href="search.html">⌕</a><a href="create.html">＋</a><a href="messages.html">♡</a><a href="notifications.html">♧</a></nav><a class="avatar" id="headAvatar" href="profile.html">J</a></header><main class="container"><h1 class="page-title">Search</h1><div class="searchbox"><input id="q" placeholder="Search people or usernames..."><button class="btn accent" id="go">Search</button></div><div id="results"></div></main><nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a class="active" href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>♡</span>Messages</a><a href="profile.html"><span>◯</span>Profile</a></nav><script>function me(){try{return JSON.parse(localStorage.getItem('pixora_profile'))||{name:'Pixora User',username:'pixorauser',avatar:''}}catch(e){return {name:'Pixora User',username:'pixorauser',avatar:''}}}function initials(n){return(n||'?')[0].toUpperCase()}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function profiles(){const m=me(),map=new Map();map.set(m.username,m);JSON.parse(localStorage.getItem('pixora_profiles')||'[]').forEach(p=>map.set(p.username,p));JSON.parse(localStorage.getItem('bb_posts')||'[]').forEach(p=>{if(p.username&&!map.has(p.username))map.set(p.username,{name:p.user,username:p.username,avatar:p.avatar||'',followers:0,following:0})});return [...map.values()]}function render(){const q=document.getElementById('q').value.trim().toLowerCase();const list=profiles().filter(p=>!q||p.name.toLowerCase().includes(q)||p.username.toLowerCase().includes(q));document.getElementById('results').innerHTML=list.length?list.map(p=>`<div class="profile-card"><div class="person">${p.avatar?`<img class="big-avatar avatar-photo" src="${esc(p.avatar)}">`:`<div class="big-avatar">${initials(p.name)}</div>`}<div style="flex:1"><b>${esc(p.name)}</b><div class="muted">@${esc(p.username)}</div></div><button class="btn secondary" onclick="toggleFollow('${esc(p.username)}')" id="f-${esc(p.username)}">${isFollowing(p.username)?'Following':'Follow'}</button></div></div>`).join(''):'<div class="empty"><div class="empty-icon">⌕</div><h2>No users found</h2><p>Try searching for another name or username.</p></div>'}function isFollowing(u){return JSON.parse(localStorage.getItem('pixora_following')||'[]').includes(u)}function toggleFollow(u){let a=new Set(JSON.parse(localStorage.getItem('pixora_following')||'[]'));a.has(u)?a.delete(u):a.add(u);localStorage.setItem('pixora_following',JSON.stringify([...a]));render()}document.getElementById('go').onclick=render;document.getElementById('q').addEventListener('input',render);const p=me();document.getElementById('headAvatar').innerHTML=p.avatar?`<img class="topbar-avatar" src="${p.avatar}">`:initials(p.name);render()</script></body></html>
