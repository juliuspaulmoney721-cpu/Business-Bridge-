<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search — Pixora</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a class="active" href="search.html">⌕</a><a href="create.html">＋</a><a href="messages.html">▢</a><a href="notifications.html">♧</a></nav><a class="avatar" data-user-avatar href="profile.html">?</a></header><main class="container"><h1 class="page-title">Search</h1><div class="searchbox"><input id="q" placeholder="Search people or username..."><button class="btn accent" id="go">Search</button></div><div id="results"></div></main><nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a class="active" href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>▢</span>Messages</a><a href="profile.html"><span>◯</span>Profile</a></nav><script type="module">import{searchProfiles,currentUser,toggleFollow,isFollowing}from'./pixora-api.js';const esc=s=>window.pixoraEsc?.(s)||String(s??'');async function render(){const q=document.getElementById('q').value.trim();const me=await currentUser();try{const list=(await searchProfiles(q)).filter(p=>p.id!==me.id);if(!list.length){document.getElementById('results').innerHTML='<div class="empty"><div class="empty-icon">⌕</div><h2>No users found</h2><p>Try another name or username.</p></div>';return}const rows=await Promise.all(list.map(async p=>{const following=await isFollowing(p.id);return `<div class="profile-card"><div class="person">${p.avatar_url?`<img class="big-avatar avatar-photo" src="${esc(p.avatar_url)}">`:`<div class="big-avatar">${esc((p.name||'?')[0].toUpperCase())}</div>`}<div style="flex:1"><b>${esc(p.name)}</b><div class="muted">@${esc(p.username)}</div></div><button class="btn secondary follow" data-id="${p.id}">${following?'Following':'Follow'}</button><a class="btn accent" href="chat.html?user=${encodeURIComponent(p.username)}">Message</a></div></div>`}));document.getElementById('results').innerHTML=rows.join('');document.querySelectorAll('.follow').forEach(b=>b.onclick=async()=>{await toggleFollow(b.dataset.id);render()})}catch(e){document.getElementById('results').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}document.getElementById('go').onclick=render;document.getElementById('q').addEventListener('input',render);render();</script><script type="module" src="app.js"></script></body></html>
