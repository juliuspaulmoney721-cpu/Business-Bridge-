<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Search — Business Bridge</title><link rel="stylesheet" href="styles.css"><style>svg{width:26px;height:26px;display:block}</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">Business Bridge</a><nav class="topnav"><a class="" href="dashboard.html" title="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-5v6h-5A1.5 1.5 0 0 1 3 19.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></a><a class="" href="search.html" title="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></a><a class="" href="create.html" title="create"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></a><a class="" href="messages.html" title="message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-5 3v-3.5a2 2 0 0 1-2-2v-7.5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></a><a class="" href="notifications.html" title="bell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12l-1.2-1.7a4 4 0 0 1-.8-2.4V10a4 4 0 0 0-8 0v2.9a4 4 0 0 1-.8 2.4zM10 20h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a></nav><a class="avatar" href="profile.html" aria-label="Profile">J</a></header><main class="container"><h1 class="page-title">Find People &amp; Businesses</h1>
<p class="subtitle">Search for businesses, creators, students and other Business Bridge members.</p>
<div class="searchbox"><input id="searchInput" placeholder="Search by name..." autocomplete="off"><button class="btn accent" id="searchBtn">Search</button></div>
<div class="chips"><button class="chip active" data-type="all">All</button><button class="chip" data-type="business">Businesses</button><button class="chip" data-type="creator">Creators</button><button class="chip" data-type="student">Students</button></div>
<div id="status" class="status"></div><section id="results"></section></main><nav class="bottom-nav"><a class="" href="dashboard.html"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-5v6h-5A1.5 1.5 0 0 1 3 19.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>Home</a><a class="active" href="search.html"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>Search</a><a class="" href="create.html"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>Create</a><a class="" href="messages.html"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-5 3v-3.5a2 2 0 0 1-2-2v-7.5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>Messages</a><a class="" href="profile.html"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 20c.7-4 2.9-6 6.5-6s5.8 2 6.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>Profile</a></nav><script>
const demo=[{id:"d1",full_name:"Julius Oghenero",account_type:"business"},{id:"d2",full_name:"Julius Oghenero",account_type:"student"},{id:"d3",full_name:"Alex Morgan",account_type:"creator"}];
let type="all";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
 const q=document.getElementById("searchInput").value.trim().toLowerCase();
 const list=demo.filter(p=>(type==="all"||p.account_type===type)&&(!q||p.full_name.toLowerCase().includes(q)));
 document.getElementById("status").textContent=list.length+" members found";
 document.getElementById("results").innerHTML=list.map(p=>`<div class="profile-card"><div class="person"><div class="big-avatar">${esc(p.full_name[0])}</div><div style="flex:1"><h2 style="margin:0">${esc(p.full_name)}</h2><span class="tag">${esc(p.account_type)}</span><p class="muted">Business Bridge member</p></div><button class="btn accent" onclick="connect('${p.id}')">Connect</button></div></div>`).join("")||'<div class="empty"><div class="empty-icon">⌕</div><h2>No members found</h2><p>Try another name or account type.</p></div>';
}
function connect(id){let a=JSON.parse(localStorage.getItem("bb_connections")||"[]");if(!a.includes(id))a.push(id);localStorage.setItem("bb_connections",JSON.stringify(a));alert("Connection request sent.");}
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");type=b.dataset.type;render()});
document.getElementById("searchBtn").onclick=render;document.getElementById("searchInput").onkeydown=e=>{if(e.key==="Enter")render()};render();
</script></body></html>
