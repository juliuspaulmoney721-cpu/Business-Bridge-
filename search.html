<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Search — Pixora</title><link rel="stylesheet" href="styles.css"><style>.profile-card{padding:16px;border-bottom:1px solid #eee}.person{display:flex;align-items:center;gap:14px}.person-copy{flex:1}.person-actions{display:flex;gap:8px}.person-actions button{white-space:nowrap}.big-avatar{width:58px;height:58px;border-radius:50%;background:#eee4f7;color:#913bd2;display:grid;place-items:center;font-weight:700;font-size:22px;overflow:hidden}.big-avatar img{width:100%;height:100%;object-fit:cover}</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a class="active" href="search.html">⌕</a><a href="create.html">＋</a><a href="messages.html">♡</a><a href="notifications.html">♧</a></nav><a class="avatar" id="headAvatar" href="profile.html">J</a></header><main class="container"><h1 class="page-title">Search</h1><div class="searchbox"><input id="q" placeholder="Search people or usernames..."><button class="btn accent" id="go">Search</button></div><div id="results"></div></main><nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a class="active" href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>♡</span>Messages</a><a href="profile.html"><span>◯</span>Profile</a></nav><script src="pixora-data.js"></script><script type="module">
import {ensureProfile,findProfiles,followUser,unfollowUser,isFollowing,localMe} from './pixora-cloud.js';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const init=s=>(String(s||'?').trim()[0]||'?').toUpperCase();
async function render(){try{await ensureProfile();const me=localMe(),q=document.getElementById('q').value.trim();document.getElementById('headAvatar').textContent=init(me.name);let list=await findProfiles(q);list=list.filter(p=>p.id!==me.id);document.getElementById('results').innerHTML=list.length?await Promise.all(list.map(async p=>{let following=false;try{following=await isFollowing(p.id)}catch{}return `<div class="profile-card"><div class="person"><div class="big-avatar">${p.avatar?`<img src="${esc(p.avatar)}" alt="">`:init(p.name)}</div><div class="person-copy"><b>${esc(p.name)}</b><div class="muted">@${esc(p.username)}</div></div><div class="person-actions"><button class="btn secondary" onclick="toggleFollow('${p.id}',this)">${following?'Following':'Follow'}</button><button class="btn accent" onclick="location.href='chat.html?user=${encodeURIComponent(p.id)}'">Message</button></div></div></div>`})).then(x=>x.join('')):'<div class="empty"><div class="empty-icon">⌕</div><h2>No users found</h2><p>Try searching for another name or username.</p></div>'}catch(e){document.getElementById('results').innerHTML=`<div class="empty"><h2>Search is not connected yet</h2><p>${esc(e.message)}</p><p>Run schema.sql in Supabase SQL Editor once.</p></div>`}}
window.toggleFollow=async(id,btn)=>{try{if(btn.textContent.trim()==='Following'){await unfollowUser(id);btn.textContent='Follow'}else{await followUser(id);btn.textContent='Following'}}catch(e){alert(e.message||'Could not update follow')}};document.getElementById('go').onclick=render;document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')render()});render();
</script><script type="module" src="app.js"></script></body></html>
