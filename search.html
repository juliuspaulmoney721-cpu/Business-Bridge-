<style>
.search-page{max-width:760px;margin:0 auto;padding:52px 34px 30px}.search-input-wrap{height:76px;border:1px solid #ddd;border-radius:12px;display:flex;align-items:center;padding:0 22px;box-shadow:0 1px 4px rgba(0,0,0,.05)}.search-input-wrap svg{width:31px;height:31px;color:#666;flex:none}.search-input-wrap input{border:0;outline:0;flex:1;font-size:25px;padding:0 18px;background:transparent}.search-tabs{display:grid;grid-template-columns:150px 180px;border-bottom:1px solid #ddd;margin-top:62px;height:72px}.search-tab{border:0;background:none;font-size:25px;color:#666;position:relative}.search-tab.active{color:#8e3bd1}.search-tab.active:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:4px;background:#963bd3}.no-results{padding:90px 20px;text-align:center;color:#666;font-size:20px}
@media(max-width:650px){.search-page{padding:52px 34px 30px}.search-input-wrap{height:74px}.search-input-wrap input{font-size:23px}.search-tabs{margin-top:58px}.search-tab{font-size:24px}}
</style></head><body>

<script>
const results=document.getElementById('results'),q=document.getElementById('q');let tab='users';
function render(){const term=q.value.trim();if(tab==='hashtags'){results.innerHTML=term?`<div class="no-results">No real hashtags found for “${term.replace(/[<>]/g,'')}”.</div>`:'<div class="no-results">Search for hashtags.</div>';return}results.innerHTML='<div class="no-results">No users yet. Real accounts will appear here after they create an account.</div>'}
document.querySelectorAll('.search-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.search-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});q.addEventListener('input',render);render();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));}</script></body></html>
