<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Search — Pixora</title><link rel="stylesheet" href="styles.css"><style>.profile-card{padding:16px;border-bottom:1px solid #eee}.person{display:flex;align-items:center;gap:14px}.person-copy{flex:1}.person-actions{display:flex;gap:8px}.person-actions button{white-space:nowrap}.big-avatar{width:58px;height:58px;border-radius:50%;background:#eee4f7;color:#913bd2;display:grid;place-items:center;font-weight:700;font-size:22px;overflow:hidden}.big-avatar img{width:100%;height:100%;object-fit:cover}</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a class="active" href="search.html">⌕</a><a href="create.html">＋</a><a href="messages.html">♡</a><a href="notifications.html">♧</a></nav><a class="avatar" id="headAvatar" href="profile.html">J</a></header><main class="container"><h1 class="page-title">Search</h1><div class="searchbox"><input id="q" placeholder="Search people or usernames..."><button class="btn accent" id="go">Search</button></div><div id="results"></div></main><nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a class="active" href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>♡</span>Messages</a><a href="profile.html"><span>◯</span>Profile</a></nav><script src="pixora-data.js"></script><script type="module">
import {ensureProfile,findProfiles,createNotification,localMe,user} from './pixora-cloud.js';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const init=s=>(String(s||'?').trim()[0]||'?').toUpperCase();
async function render(){await ensureProfile();const m=localMe(),q=document.getElementById('q').value.trim();document.getElementById('headAvatar').textContent=init(m.name);let list=await findProfiles(q);list=list.filter(p=>p.id!==m.id&&p.username!==m.username);document.getElementById('results').innerHTML=list.length?list.map(p=>`<div class="profile-card"><div class="person"><div class="big-avatar">${p.avatar?`<img src="${esc(p.avatar)}">`:init(p.name)}</div><div class="person-copy"><b>${esc(p.name)}</b><div class="muted">@${esc(p.username)}</div></div><div class="person-actions"><button class="btn secondary" onclick="followUser('${esc(p.id)}')">Follow</button><button class="btn accent" onclick="location.href='chat.html?user=${encodeURIComponent(p.id)}&name=${encodeURIComponent(p.name)}'">Message</button></div></div></div>`).join(''):'<div class="empty"><div class="empty-icon">⌕</div><h2>No users found</h2><p>Try searching for another name or username.</p></div>'}
window.followUser=async id=>{const m=await user(),me=localMe();const list=await findProfiles('');const target=list.find(p=>p.id===id);if(!target)return;const followed=PixoraData.toggleFollow(target.username);if(followed)await createNotification(target.id,'follow',m?.id,me.name,`started following you`);await render()};
document.getElementById('go').onclick=render;document.getElementById('q').addEventListener('input',render);render();
</script><script type="module" src="app.js"></script></body></html>
