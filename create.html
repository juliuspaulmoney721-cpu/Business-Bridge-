<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create — Pixora</title><link rel="stylesheet" href="styles.css"><style>.preview{min-height:160px;border:1px dashed #ddd;border-radius:16px;display:grid;place-items:center;overflow:hidden;margin-bottom:16px;color:#888}.preview img{width:100%;max-height:420px;object-fit:cover}</style></head><body>
<header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a href="search.html">⌕</a><a class="active" href="create.html">＋</a><a href="messages.html">▢</a><a href="notifications.html">♧</a></nav><a class="avatar" data-user-avatar href="profile.html">?</a></header>
<main class="container"><h1 class="page-title">Create post</h1><p class="subtitle">Share something with the Pixora community.</p><div class="create-card"><div class="field"><label>Content</label><textarea id="content" rows="6" placeholder="What do you want to share?"></textarea></div><div class="field"><label>Photo</label><input id="image" type="file" accept="image/*"></div><div id="preview" class="preview">Choose a photo</div><button class="btn accent full" id="publish">Publish post</button><p id="status" class="status"></p></div></main>
<nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a class="active" href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>▢</span>Messages</a><a href="profile.html"><span>◯</span>Profile</a></nav>
<script type="module">import{uploadImage,createPost}from'./pixora-api.js';let file=null;const $=id=>document.getElementById(id);$('image').onchange=e=>{file=e.target.files[0]||null;if(file)$('preview').innerHTML=`<img src="${URL.createObjectURL(file)}" alt="Preview">`};$('publish').onclick=async()=>{const content=$('content').value.trim(),b=$('publish'),s=$('status');if(!content&&!file){s.textContent='Add some content or choose a photo.';return}b.disabled=true;s.textContent='Publishing...';try{const imageUrl=file?await uploadImage(file,'posts'):'';await createPost({content,imageUrl});location.href='dashboard.html'}catch(e){s.textContent=e.message||'Could not publish.';b.disabled=false}};</script><script type="module" src="app.js"></script></body></html>
