<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create — Pixora</title><link rel="stylesheet" href="styles.css"><style>.mode-tabs{display:flex;background:#f3f3f5;border-radius:14px;padding:4px;margin-bottom:20px}.mode-tabs button{flex:1;padding:12px;border-radius:11px;background:transparent}.mode-tabs button.active{background:#fff;box-shadow:0 1px 5px #ddd;font-weight:700}</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a href="search.html">⌕</a><a class="active" href="create.html">＋</a><a href="messages.html">▢</a><a href="notifications.html">♧</a></nav><a class="avatar" data-user-avatar href="profile.html">?</a></header><main class="container"><h1 class="page-title">Create</h1><p class="subtitle">Share a post or a story with your Pixora community.</p><div class="mode-tabs"><button id="postMode" class="active">Post</button><button id="storyMode">Story</button></div><div class="create-card"><div class="field"><label>Caption</label><textarea id="caption" rows="5" placeholder="Write a caption..."></textarea></div><div class="field"><label>Photo</label><input id="image" type="file" accept="image/*"></div><div id="preview" class="preview">Choose a photo</div><button class="btn accent full" id="publish">Publish post</button><p id="status" class="status"></p></div></main><nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a class="active" href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>▢</span>Messages</a><a href="profile.html"><span>◯</span>Profile</a></nav><script type="module">import{uploadImage,createPost,createStory}from'./pixora-api.js';let mode='post',file=null;const $=id=>document.getElementById(id);$('postMode').onclick=()=>{mode='post';$('postMode').classList.add('active');$('storyMode').classList.remove('active');$('publish').textContent='Publish post'};$('storyMode').onclick=()=>{mode='story';$('storyMode').classList.add('active');$('postMode').classList.remove('active');$('publish').textContent='Add story'};$('image').onchange=e=>{file=e.target.files[0]||null;if(file){$('preview').innerHTML=`<img src="${URL.createObjectURL(file)}" alt="Preview">`}};$('publish').onclick=async()=>{const caption=$('caption').value.trim(),s=$('status'),b=$('publish');if(!caption&&!file){s.textContent='Add a caption or photo.';return}b.disabled=true;s.textContent='Publishing...';try{const url=file?await uploadImage(file,mode==='story'?'stories':'posts'):'';if(mode==='story')await createStory({caption,imageUrl:url});else await createPost({caption,imageUrl:url});location.href='dashboard.html'}catch(e){s.textContent=e.message||'Could not publish.';b.disabled=false}};</script><script type="module" src="app.js"></script></body></html>
