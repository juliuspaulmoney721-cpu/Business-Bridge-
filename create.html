<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Create — Pixora</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.json"><style>.mode-tabs{display:flex;background:#f3f3f5;border-radius:14px;padding:4px;margin-bottom:20px}.mode-tabs button{flex:1;border:0;background:transparent;padding:11px;border-radius:11px}.mode-tabs button.active{background:#fff;box-shadow:0 1px 5px #ddd;font-weight:700}.small-note{color:#777;font-size:14px}.preview img{width:100%;max-height:460px;object-fit:cover}</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a href="search.html">⌕</a><a class="active" href="create.html">＋</a><a href="messages.html">♡</a><a href="notifications.html">♧</a></nav><a class="avatar" id="headAvatar" href="profile.html">J</a></header><main class="container"><h1 class="page-title">Create</h1><p class="subtitle">Share a post or a story with your Pixora community.</p><div class="mode-tabs"><button id="postMode" class="active">Post</button><button id="storyMode">Story</button></div><div class="create-card"><div class="field"><label for="caption">Caption</label><textarea id="caption" rows="5" placeholder="Write a caption..."></textarea></div><div class="field"><label for="image">Photo</label><input id="image" type="file" accept="image/*"></div><div id="preview" class="preview">Choose a photo</div><p class="small-note" id="storyNote" style="display:none">Stories are shown for 24 hours.</p><button class="btn accent full" id="publish">Publish post</button></div></main><nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a class="active" href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>♡</span>Messages</a><a href="profile.html"><span>◯</span>Profile</a></nav><script src="pixora-data.js"></script><script>let dataUrl='',mode='post';function profile(){return PixoraData.me()}function compress(file,max=1600,q=.84){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(new Error('Could not read image.'));r.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Could not load image.'));img.onload=()=>{const scale=Math.min(1,max/img.width,max/img.height),w=Math.round(img.width*scale),h=Math.round(img.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',q))};img.src=r.result};r.readAsDataURL(file)})}document.getElementById('image').onchange=async e=>{if(!e.target.files[0])return;try{dataUrl=await compress(e.target.files[0]);document.getElementById('preview').innerHTML=`<img src="${dataUrl}" alt="Preview">`}catch(err){alert(err.message)}};function setMode(m){mode=m;document.getElementById('postMode').classList.toggle('active',m==='post');document.getElementById('storyMode').classList.toggle('active',m==='story');document.getElementById('publish').textContent=m==='post'?'Publish post':'Add story';document.getElementById('storyNote').style.display=m==='story'?'block':'none';document.getElementById('caption').placeholder=m==='post'?'Write a caption...':'Add a story caption...'}document.getElementById('postMode').onclick=()=>setMode('post');document.getElementById('storyMode').onclick=()=>setMode('story');if(new URLSearchParams(location.search).get('story')==='1')setMode('story');document.getElementById('publish').onclick=()=>{const text=document.getElementById('caption').value.trim(),p=profile();if(!dataUrl&&!text){alert('Add a photo or caption.');return}if(mode==='story'){let s=PixoraData.read('pixora_stories',[]).filter(x=>Date.now()-x.created<86400000);s.unshift({id:Date.now(),user:p.name,username:p.username,avatar:p.avatar||'',text,image:dataUrl,created:Date.now()});PixoraData.write('pixora_stories',s);location.href='dashboard.html';return}let posts=PixoraData.read('bb_posts',[]);posts.unshift({id:Date.now(),author_id:p.id||'',user:p.name,username:p.username,avatar:p.avatar||'',initial:(p.name||'?')[0].toUpperCase(),time:'Just now',likes:0,liked:false,likedBy:[],text,image:dataUrl});PixoraData.write('bb_posts',posts);PixoraData.register(p);location.href='dashboard.html'};const p=profile();document.getElementById('headAvatar').innerHTML=p.avatar?`<img class="topbar-avatar" src="${p.avatar}" alt="Profile picture">`:(p.name||'?')[0].toUpperCase()</script></script><script type="module" src="app.js"></script></body></html>
