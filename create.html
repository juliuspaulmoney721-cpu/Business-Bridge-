<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Create — Business Bridge</title><link rel="stylesheet" href="styles.css"><style>svg{width:26px;height:26px;display:block}</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">Business Bridge</a><nav class="topnav"><a class="" href="dashboard.html" title="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-5v6h-5A1.5 1.5 0 0 1 3 19.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></a><a class="" href="search.html" title="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></a><a class="" href="create.html" title="create"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></a><a class="" href="messages.html" title="message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-5 3v-3.5a2 2 0 0 1-2-2v-7.5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></a><a class="" href="notifications.html" title="bell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12l-1.2-1.7a4 4 0 0 1-.8-2.4V10a4 4 0 0 0-8 0v2.9a4 4 0 0 1-.8 2.4zM10 20h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a></nav><a class="avatar" href="profile.html" aria-label="Profile">J</a></header><main class="container"><h1 class="page-title">Create</h1><p class="subtitle">Share something with your Business Bridge community.</p>
<div class="create-card"><div class="field"><label for="caption">Caption</label><textarea id="caption" rows="5" placeholder="What's on your mind?"></textarea></div>
<div class="field"><label for="image">Image</label><input id="image" type="file" accept="image/*"></div><div id="preview" class="preview">Image preview</div>
<button class="btn accent full" id="publish">Publish</button></div></main><nav class="bottom-nav"><a class="" href="dashboard.html"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-5v6h-5A1.5 1.5 0 0 1 3 19.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>Home</a><a class="" href="search.html"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>Search</a><a class="active" href="create.html"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>Create</a><a class="" href="messages.html"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-5 3v-3.5a2 2 0 0 1-2-2v-7.5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>Messages</a><a class="" href="profile.html"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 20c.7-4 2.9-6 6.5-6s5.8 2 6.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>Profile</a></nav><script>
let dataUrl="";
document.getElementById("image").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{dataUrl=r.result;document.getElementById("preview").innerHTML=`<img src="${r.result}" alt="Preview">`};r.readAsDataURL(f)};
document.getElementById("publish").onclick=()=>{const text=document.getElementById("caption").value.trim();if(!text&&!dataUrl){alert("Add a caption or image.");return}let posts=JSON.parse(localStorage.getItem("bb_posts")||"[]");posts.unshift({user:"Julius Oghenero",initial:"J",time:"Just now",likes:0,liked:false,text,image:dataUrl});localStorage.setItem("bb_posts",JSON.stringify(posts));location.href="dashboard.html"};
</script></body></html>
