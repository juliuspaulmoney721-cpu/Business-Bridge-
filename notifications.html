<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications — Pixora</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a href="search.html">⌕</a><a href="create.html">＋</a><a href="messages.html">▢</a><a class="active" href="notifications.html">♧</a></nav><a class="avatar" data-user-avatar href="profile.html">?</a></header>
<main class="container"><h1 class="page-title">Notifications</h1><div id="list"><div class="status">Loading notifications...</div></div></main>
<nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>▢</span>Messages</a><a class="active" href="notifications.html"><span>♧</span>Notifications</a></nav>
<script type="module">import{listNotifications,markNotificationsRead}from'./pixora-api.js';const esc=s=>window.pixoraEsc?.(s)||String(s??'');async function render(){try{const rows=await listNotifications();document.getElementById('list').innerHTML=rows.length?rows.map(n=>`<div class="profile-card person ${n.is_read?'':'unread-notice'}">${n.actor?.avatar_url?`<img class="big-avatar avatar-photo" src="${esc(n.actor.avatar_url)}">`:`<div class="big-avatar">${esc((n.actor?.name||'?')[0].toUpperCase())}</div>`}<div style="flex:1"><b>${esc(n.title||'Notification')}</b><div>${esc(n.message||'')}</div><div class="muted">${new Date(n.created_at).toLocaleString()}</div></div></div>`).join(''):'<div class="empty"><div class="empty-icon">♧</div><h2>No notifications yet</h2><p>New follows and messages will appear here.</p></div>';await markNotificationsRead()}catch(e){document.getElementById('list').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}render();</script><script type="module" src="app.js"></script></body></html>
