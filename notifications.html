<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Notifications — Pixora</title><link rel="stylesheet" href="styles.css"><style>.notification{display:flex;gap:14px;align-items:flex-start;padding:17px 4px;border-bottom:1px solid #eee}.notification.unread{background:#faf4ff}.notif-icon{width:48px;height:48px;border-radius:50%;background:#eee4f7;color:#913bd2;display:grid;place-items:center;font-size:22px}.notif-copy{flex:1}.notif-copy b{color:#111}.notif-time{font-size:13px;color:#888;margin-top:5px}</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">Pixora</a><nav class="topnav"><a href="dashboard.html">⌂</a><a href="search.html">⌕</a><a href="create.html">＋</a><a href="messages.html">♡</a><a class="active" href="notifications.html">♧</a></nav><a class="avatar" href="profile.html">J</a></header><main class="container"><h1 class="page-title">Notifications</h1><div id="list"></div></main><nav class="bottom-nav"><a href="dashboard.html"><span>⌂</span>Home</a><a href="search.html"><span>⌕</span>Search</a><a href="create.html"><span>＋</span>Create</a><a href="messages.html"><span>♡</span>Messages</a><a class="active" href="profile.html"><span>◯</span>Profile</a></nav><script type="module">
import {getNotifications,markNotificationsRead,ensureProfile} from './pixora-cloud.js';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=d=>{const n=Math.max(1,Math.floor((Date.now()-new Date(d).getTime())/1000));if(n<60)return `${n}s ago`;if(n<3600)return `${Math.floor(n/60)}m ago`;if(n<86400)return `${Math.floor(n/3600)}h ago`;return `${Math.floor(n/86400)}d ago`};
async function render(){await ensureProfile();const rows=await getNotifications();document.getElementById('list').innerHTML=rows.length?rows.map(n=>`<div class="notification ${n.read?'':'unread'}"><div class="notif-icon">${n.type==='message'?'✉':'♡'}</div><div class="notif-copy"><b>${esc(n.actor_name||'Pixora')}</b> ${esc(n.text||'') }<div class="notif-time">${ago(n.created_at)}</div></div></div>`).join(''):`<div class="empty"><div class="empty-icon">♧</div><h2>No notifications yet</h2><p>Messages, follows and other activity will appear here.</p></div>`;await markNotificationsRead()}
render();setInterval(render,5000);
</script><script type="module" src="app.js"></script></body></html>
