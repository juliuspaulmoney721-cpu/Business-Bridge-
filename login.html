<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Bridge - Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#12355b;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:white;padding:35px;border-radius:12px;width:90%;max-width:380px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.2)}
h1{color:#12355b}
input{width:100%;padding:12px;margin:10px 0;border-radius:6px;border:1px solid #ccc}
button{width:100%;padding:12px;background:#12355b;color:white;border:none;border-radius:6px;cursor:pointer;font-size:16px}
button:hover{background:#1d5d91}
a{color:#12355b;text-decoration:none}
#message{margin-top:15px;min-height:20px}
</style>
</head>
<body>
<div class="box">
<h1>Business Bridge</h1>
<p>Welcome Back</p>

<form id="loginForm">
<input id="email" type="email" placeholder="Email" required autocomplete="email">
<input id="password" type="password" placeholder="Password" required autocomplete="current-password">
<button type="submit">Login</button>
</form>

<div id="message"></div>

<p>Don't have an account?</p>
<a href="signup.html">Create Account</a>
<br><br>
<a href="index.html">← Back to Home</a>
</div>

<script type="module">
import { supabase } from "./supabase.js";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  message.textContent = "Signing in...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  if (!data.session) {
    message.textContent = "Login succeeded, but no session was created.";
    return;
  }

  window.location.href = "dashboard.html";
});
</script>
</body>
</html>
