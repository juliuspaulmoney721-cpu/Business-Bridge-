<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Bridge - Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#12355b;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
width:360px;
padding:35px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
text-align:center;
}

h1{
color:#12355b;
margin-bottom:10px;
}

p{
color:#666;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#12355b;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0d2743;
}

#message{
margin-top:15px;
font-weight:bold;
}

.links{
margin-top:20px;
}

.links a{
display:block;
margin-top:10px;
text-decoration:none;
color:#12355b;
font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

<h1>Business Bridge</h1>

<p>Welcome Back</p>

<input
id="email"
type="email"
placeholder="Email Address"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button id="loginBtn">

Login

</button>

<p id="message"></p>

<div class="links">

<a href="signup.html">

Create Account

</a>

<a href="index.html">

← Back to Home

</a>

</div>

</div>

<script type="module">

import { supabase } from "./supabase.js";

const email=document.getElementById("email");

const password=document.getElementById("password");

const message=document.getElementById("message");

document.getElementById("loginBtn").addEventListener("click",async()=>{

message.style.color="black";

message.innerHTML="Signing in...";

const {data,error}=await supabase.auth.signInWithPassword({

email:email.value,

password:password.value

});

if(error){

message.style.color="red";

message.innerHTML=error.message;

return;

}

message.style.color="green";

message.innerHTML="Login successful!";

setTimeout(()=>{

window.location.href="dashboard.html";

},1000);

});

</script>

</body>
</html>
