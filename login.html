<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Bridge - Login</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#12355b;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    padding:35px;
    border-radius:12px;
    width:320px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

h1{
    color:#12355b;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    background:#12355b;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d5d91;
}

a{
    color:#12355b;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

<h1>Business Bridge</h1>

<p>Welcome Back</p>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button>Login</button>

<p>Don't have an account?</p>

<a href="signup.html">Create Account</a>

<br><br>

<a href="index.html">← Back to Home</a>

</div>

</body>
</html>
