<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#050505"><title>Business Bridge</title><style>
:root{--bg:#050505;--panel:#0d0d0f;--panel2:#141416;--line:#25252a;--text:#f5f5f7;--muted:#9b9ba5;--accent:#c04cff;--accent2:#8f39ff;--danger:#ff4d67}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body{min-height:100vh;padding-bottom:84px}a{text-decoration:none;color:inherit}button,input,textarea{font:inherit}button{cursor:pointer}
.topbar{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:22px;position:sticky;top:0;background:rgba(5,5,5,.96);z-index:20}.brand{font-size:28px;font-weight:800;color:var(--accent);letter-spacing:-1px}.topnav{display:flex;align-items:center;gap:24px;flex:1}.topnav a{color:#aaa;font-size:24px}.topnav a.active,.topnav a:hover{color:var(--accent)}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#1d0c2a;border:1px solid #43235b;color:var(--accent);font-weight:700}
.container{width:min(760px,100%);margin:0 auto;padding:18px}.wide{width:min(980px,100%)}.stories{display:flex;gap:18px;overflow:auto;padding:8px 0 18px;border-bottom:1px solid var(--line)}.story{min-width:72px;text-align:center;color:var(--muted);font-size:12px}.story-ring{width:62px;height:62px;border-radius:50%;padding:2px;margin:0 auto 6px;background:linear-gradient(135deg,var(--accent),#5f2bff)}.story-inner{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:#15151a;border:2px solid #080808;color:var(--accent);font-weight:700}.story.add .story-inner{font-size:28px}
.feed{display:flex;flex-direction:column;gap:18px;margin-top:18px}.post{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.post-head{display:flex;align-items:center;gap:10px;padding:15px}.post-user{font-weight:700}.post-time{font-size:12px;color:var(--muted);margin-top:3px}.post-media{width:100%;aspect-ratio:1/1;display:grid;place-items:center;background:linear-gradient(145deg,#111,#090909);font-size:80px}.post-media img{width:100%;height:100%;object-fit:cover}.post-body{padding:12px 15px}.post-actions{display:flex;gap:22px;font-size:26px;color:#c8c8cf}.post-actions button{background:none;border:0;color:inherit;padding:0}.post-actions button.liked{color:var(--accent)}.likes{font-weight:700;margin:10px 0 6px}.caption{color:#ddd;line-height:1.45}.comment-preview{color:var(--muted);margin-top:7px}.composer{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:18px}.composer textarea,.field input,.field textarea{width:100%;background:#101014;border:1px solid #303038;border-radius:12px;color:var(--text);padding:13px;outline:none}.composer textarea:focus,.field input:focus,.field textarea:focus{border-color:var(--accent)}.row{display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:12px;padding:11px 18px;background:var(--accent);color:#090909;font-weight:700}.btn.secondary{background:#242429;color:#fff}.btn.ghost{background:transparent;border:1px solid #34343b;color:#fff}.btn.full{width:100%}
.page-title{font-size:38px;line-height:1.08;margin:24px 0 8px}.subtitle{color:var(--muted);font-size:17px;line-height:1.5}.searchbox{display:flex;gap:10px;margin:22px 0}.searchbox input{flex:1;background:#111114;border:1px solid #34343a;border-radius:14px;padding:15px;color:white}.chips{display:flex;gap:10px;overflow:auto;margin-bottom:20px}.chip{border:1px solid #38383f;background:transparent;color:#bbb;border-radius:22px;padding:10px 17px;white-space:nowrap}.chip.active{background:var(--accent);color:#090909;border-color:var(--accent)}.profile-card,.info-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.person{display:flex;gap:14px;align-items:center}.big-avatar{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:#1c0d28;color:var(--accent);font-size:25px;font-weight:800}.tag{display:inline-block;background:#24162d;color:#d8b3ff;border-radius:9px;padding:5px 9px;font-size:12px;margin-top:6px}.muted{color:var(--muted)}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:78px;background:rgba(8,8,9,.98);border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:30}.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8d8d96;font-size:11px}.bottom-nav a span{font-size:24px}.bottom-nav a.active{color:var(--accent)}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px}.auth-card h1{color:var(--accent);font-size:34px;margin-top:0}.field{margin:14px 0}.field label{display:block;color:#bbb;margin-bottom:7px;font-size:13px}.error{color:#ff7184;margin:10px 0}.success{color:#8cffb1;margin:10px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.sheet{width:min(650px,100%);background:#111114;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px}.empty{text-align:center;padding:40px 20px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#25252b;color:#fff;border:1px solid #3a3a42;padding:11px 15px;border-radius:12px;display:none;z-index:60}.toast.show{display:block}
@media(min-width:800px){.bottom-nav{display:none}.container{padding-top:28px}.topbar{padding:0 max(18px,calc((100vw - 1100px)/2))}}
</style></head><body><header class="topbar"><a class="brand" href="dashboard.html">Business Bridge</a><nav class="topnav"><a href="dashboard.html" title="Home">⌂</a><a href="search.html" title="Search">⌕</a><a href="create.html" title="Create">⊞</a><a href="messages.html" title="Messages">□</a><a href="notifications.html" title="Notifications">♧</a></nav><a class="avatar" id="topAvatar" href="profile.html">J</a></header><main class="container"><div class="auth"><div class="auth-card"><h1>Business Bridge</h1><p class="subtitle">Sign in to your network.</p><div id="msg"></div><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="••••••••"></div><button class="btn full" onclick="login()">Login</button><p class="muted" style="text-align:center;margin-top:18px">Don't have an account? <a href="signup.html" style="color:var(--accent)">Create one</a></p></div></div></main><nav class="bottom-nav"><a href="dashboard.html" data-page="home"><span>⌂</span>Home</a><a href="search.html" data-page="search"><span>⌕</span>Search</a><a href="connect.html" data-page="connect"><span>🤝</span>Connect</a><a href="messages.html" data-page="messages"><span>💬</span>Messages</a><a href="profile.html" data-page="profile"><span>●</span>Profile</a></nav><script type="module">import {supabase} from './supabase.js';window.login=async()=>{let email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;let m=document.getElementById('msg');m.className='muted';m.textContent='Signing in...';let {error}=await supabase.auth.signInWithPassword({email,password});if(error){m.className='error';m.textContent=error.message;return}location.href='dashboard.html'}</script></body></html>
