<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Pixora</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-wrap"><div class="auth-card"><div class="brand">Pixora</div><h1>Welcome back</h1><p class="subtitle">Log in to your Pixora account.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn accent full" id="login">Login</button><p class="muted center">Don't have an account? <a href="signup.html" class="accent-link">Create one</a></p><p id="status" class="status"></p></div></main><script type="module">import{supabase}from'./supabase.js';import{ensureProfile}from'./pixora-api.js';document.getElementById('login').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,b=document.getElementById('login'),s=document.getElementById('status');if(!email||!password){s.textContent='Enter your email and password.';return}b.disabled=true;b.textContent='Logging in...';try{const{data,error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;await ensureProfile(data.user);location.href='dashboard.html'}catch(e){s.textContent=e.message||'Login failed.';b.disabled=false;b.textContent='Login'}};</script></body></html>
